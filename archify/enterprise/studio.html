<style>
/* Layout: one technical canvas with a view rail on the left and one evidence panel on the right (DESIGN.md, "The Evidence Console"). */
:root {

  --control: rgba(255, 255, 255, 0.92); --control-border: #cbd5e1; --control-text: #334155; --accent: #0891b2; --good: #059669; --warn: #b45309; --bad: #e11d48;
  --frontend: #0891b2; --backend: #059669; --database: #7c3aed; --cloud: #d97706; --security: #e11d48; --messagebus: #ea580c; --external: #64748b;

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--r-control); }

@media (max-width: 1100px) { .work { grid-template-columns: 200px minmax(0, 1fr) 320px; } }
@media (max-width: 860px) {

<script type="module">
// ---- lib/notation.mjs ----
// The Archify Enterprise visual language.
//
// One catalog owns every element kind and relationship kind across ArchiMate,
// UML, and BPMN, and maps each onto the seven semantic tones, the mono type
// scale, and the small shape vocabulary defined in DESIGN.md. Renderers,
// generators, the legend, and the Studio all read this file, so a kind can
// never look different from one diagram type to the next.

const TONES = ['frontend', 'backend', 'database', 'cloud', 'security', 'messagebus', 'external'];

// Architecture layers follow the ArchiMate colour convention, expressed in
// Archify's fixed palette: business is amber, application is cyan, technology
// is green, motivation is violet.
const LAYERS = {
  motivation: { label: 'Motivation', tone: 'database', adm: 'A' },
  strategy: { label: 'Strategy', tone: 'messagebus', adm: 'A' },
  business: { label: 'Business', tone: 'cloud', adm: 'B' },
  application: { label: 'Application', tone: 'frontend', adm: 'C' },
  technology: { label: 'Technology', tone: 'backend', adm: 'D' },
  implementation: { label: 'Implementation & Migration', tone: 'security', adm: 'F' },
  other: { label: 'Other', tone: 'external', adm: 'C' },
};

// Shape vocabulary. The aspect of an element picks its silhouette everywhere:
//   box       active structure (who or what acts)        square corners
//   round     behaviour (what is performed)              rounded corners
//   sheet     passive structure (what is acted on)       header rule
//   chamfer   motivation (why)                           cut corners
//   classifier typed structure with member compartments
//   event / gateway / bar / actor / ellipse / node3d     control and UML specials

const k = (family, layer, shape, glyph, label, extra = {}) => ({ family, layer, shape, glyph, label, tone: LAYERS[layer].tone, ...extra });

const KINDS = {
  // ArchiMate: motivation
  stakeholder: k('archimate', 'motivation', 'chamfer', 'role', 'Stakeholder'),
  driver: k('archimate', 'motivation', 'chamfer', 'driver', 'Driver'),
  assessment: k('archimate', 'motivation', 'chamfer', 'assessment', 'Assessment'),
  goal: k('archimate', 'motivation', 'chamfer', 'goal', 'Goal'),
  outcome: k('archimate', 'motivation', 'chamfer', 'outcome', 'Outcome'),
  principle: k('archimate', 'motivation', 'chamfer', 'principle', 'Principle'),
  requirement: k('archimate', 'motivation', 'chamfer', 'requirement', 'Requirement'),
  constraint: k('archimate', 'motivation', 'chamfer', 'constraint', 'Constraint'),
  value: k('archimate', 'motivation', 'ellipse', 'none', 'Value'),
  // ArchiMate: strategy
  resource: k('archimate', 'strategy', 'box', 'resource', 'Resource'),
  capability: k('archimate', 'strategy', 'round', 'capability', 'Capability'),
  'value-stream': k('archimate', 'strategy', 'round', 'process', 'Value stream'),
  'course-of-action': k('archimate', 'strategy', 'round', 'goal', 'Course of action'),
  // ArchiMate: business
  'business-actor': k('archimate', 'business', 'box', 'actor', 'Business actor'),
  'business-role': k('archimate', 'business', 'box', 'role', 'Business role'),
  'business-collaboration': k('archimate', 'business', 'box', 'collaboration', 'Business collaboration'),
  'business-interface': k('archimate', 'business', 'box', 'interface', 'Business interface'),
  'business-process': k('archimate', 'business', 'round', 'process', 'Business process'),
  'business-function': k('archimate', 'business', 'round', 'function', 'Business function'),
  'business-event': k('archimate', 'business', 'round', 'event', 'Business event'),
  'business-service': k('archimate', 'business', 'round', 'service', 'Business service'),
  'business-object': k('archimate', 'business', 'sheet', 'none', 'Business object'),
  contract: k('archimate', 'business', 'sheet', 'none', 'Contract'),
  product: k('archimate', 'business', 'sheet', 'none', 'Product'),
  // ArchiMate: application
  'application-component': k('archimate', 'application', 'box', 'component', 'Application component'),
  'application-collaboration': k('archimate', 'application', 'box', 'collaboration', 'Application collaboration'),
  'application-interface': k('archimate', 'application', 'box', 'interface', 'Application interface'),
  'application-function': k('archimate', 'application', 'round', 'function', 'Application function'),
  'application-process': k('archimate', 'application', 'round', 'process', 'Application process'),
  'application-event': k('archimate', 'application', 'round', 'event', 'Application event'),
  'application-service': k('archimate', 'application', 'round', 'service', 'Application service'),
  'data-object': k('archimate', 'application', 'sheet', 'none', 'Data object'),
  // ArchiMate: technology
  node: k('archimate', 'technology', 'node3d', 'none', 'Node'),
  device: k('archimate', 'technology', 'node3d', 'device', 'Device'),
  'system-software': k('archimate', 'technology', 'box', 'software', 'System software'),
  'technology-interface': k('archimate', 'technology', 'box', 'interface', 'Technology interface'),
  'technology-service': k('archimate', 'technology', 'round', 'service', 'Technology service'),
  'communication-network': k('archimate', 'technology', 'box', 'network', 'Communication network'),
  artifact: k('archimate', 'technology', 'sheet', 'artifact', 'Artifact'),
  // ArchiMate: implementation and migration
  'work-package': k('archimate', 'implementation', 'round', 'workpackage', 'Work package'),
  deliverable: k('archimate', 'implementation', 'sheet', 'none', 'Deliverable'),
  plateau: k('archimate', 'implementation', 'node3d', 'plateau', 'Plateau'),
  gap: k('archimate', 'implementation', 'ellipse', 'gap', 'Gap'),
  // UML: classifiers (tones match the native Archify class renderer)
  class: k('uml', 'application', 'classifier', 'none', 'Class', { tone: 'backend' }),
  abstract: k('uml', 'application', 'classifier', 'none', 'Abstract class', { tone: 'backend', stereotype: 'abstract', italic: true }),
  interface: k('uml', 'application', 'classifier', 'none', 'Interface', { tone: 'frontend', stereotype: 'interface' }),
  enum: k('uml', 'application', 'classifier', 'none', 'Enumeration', { tone: 'messagebus', stereotype: 'enumeration' }),
  record: k('uml', 'application', 'classifier', 'none', 'Record', { tone: 'database', stereotype: 'record' }),
  entity: k('uml', 'application', 'classifier', 'none', 'Entity', { tone: 'database', stereotype: 'entity' }),
  // UML: structure and use cases
  component: k('uml', 'application', 'box', 'component', 'Component'),
  package: k('uml', 'application', 'box', 'package', 'Package'),
  actor: k('uml', 'business', 'actor', 'none', 'Actor', { tone: 'external' }),
  usecase: k('uml', 'application', 'ellipse', 'none', 'Use case'),
  'execution-node': k('uml', 'technology', 'node3d', 'none', 'Execution node'),
  // UML: behaviour
  state: k('uml', 'application', 'round', 'none', 'State'),
  initial: k('uml', 'other', 'event', 'none', 'Initial node', { fill: 'solid' }),
  final: k('uml', 'other', 'event', 'none', 'Final node', { fill: 'bullseye' }),
  choice: k('uml', 'other', 'gateway', 'none', 'Choice', { tone: 'cloud' }),
  action: k('uml', 'application', 'round', 'none', 'Action'),
  decision: k('uml', 'other', 'gateway', 'none', 'Decision', { tone: 'cloud' }),
  merge: k('uml', 'other', 'gateway', 'none', 'Merge', { tone: 'cloud' }),
  fork: k('uml', 'other', 'bar', 'none', 'Fork'),
  join: k('uml', 'other', 'bar', 'none', 'Join'),
  'object-node': k('uml', 'application', 'sheet', 'none', 'Object node', { tone: 'database' }),
  // BPMN
  'start-event': k('bpmn', 'business', 'event', 'none', 'Start event', { tone: 'backend', ring: 'thin' }),
  'intermediate-event': k('bpmn', 'business', 'event', 'none', 'Intermediate event', { tone: 'cloud', ring: 'double' }),
  'end-event': k('bpmn', 'business', 'event', 'none', 'End event', { tone: 'security', ring: 'thick' }),
  task: k('bpmn', 'business', 'round', 'none', 'Task', { tone: 'frontend' }),
  subprocess: k('bpmn', 'business', 'round', 'subprocess', 'Sub-process', { tone: 'frontend' }),
  'exclusive-gateway': k('bpmn', 'business', 'gateway', 'none', 'Exclusive gateway', { mark: 'x' }),
  'parallel-gateway': k('bpmn', 'business', 'gateway', 'none', 'Parallel gateway', { mark: 'plus' }),
  'inclusive-gateway': k('bpmn', 'business', 'gateway', 'none', 'Inclusive gateway', { mark: 'o' }),
  'data-store': k('bpmn', 'business', 'sheet', 'store', 'Data store', { tone: 'database' }),
  // Shared
  note: k('shared', 'other', 'note', 'none', 'Note'),
};

// Markers: none | open (open arrow) | filled (solid arrow) | triangle (hollow
// generalisation) | diamond / diamond-filled | dot | circle (hollow).
const r = (family, label, dash, start, end, verb) => ({ family, label, dash, start, end, verb });

const RELATIONS = {
  // Structural
  composition: r('structural', 'Composition', 'solid', 'diamond-filled', 'none', 'is composed of'),
  aggregation: r('structural', 'Aggregation', 'solid', 'diamond', 'none', 'aggregates'),
  assignment: r('structural', 'Assignment', 'solid', 'dot', 'filled', 'is assigned to'),
  realization: r('structural', 'Realization', 'dashed', 'none', 'triangle', 'realizes'),
  // Dependency
  serving: r('dependency', 'Serving', 'solid', 'none', 'open', 'serves'),
  access: r('dependency', 'Access', 'dotted', 'none', 'open', 'accesses'),

// ---- lib/model.mjs ----
// Enterprise model repository: one set of elements and relationships, many
// views. Validation returns Archify-style diagnostics (code, severity,
// subject, message, supportedFixes) instead of throwing.


const ID = /^[a-zA-Z][a-zA-Z0-9_-]*$/;
const GRID_VIEWS = Object.keys(VIEW_TYPES).filter((type) => type !== 'sequence');
const MESSAGE_KINDS = ['sync', 'async', 'reply', 'self'];

function indexModel(model) {
  const elements = new Map((model.elements || []).map((element) => [element.id, element]));
  const relationships = new Map((model.relationships || []).map((rel) => [rel.id, rel]));
  const views = new Map((model.views || []).map((view) => [view.id, view]));
  return { elements, relationships, views };
}

// Relationships drawn in a view: every model relationship whose two ends are
// both placed, unless the view lists `relationships` or `exclude`.
function viewRelationships(model, view) {
  const placed = new Set(view.type === 'sequence' ? (view.participants || []) : (view.nodes || []).map((node) => node.ref));
  const only = Array.isArray(view.relationships) ? new Set(view.relationships) : null;
  const exclude = new Set(view.exclude || []);
  return (model.relationships || []).filter((rel) => placed.has(rel.from) && placed.has(rel.to)
    && (!only || only.has(rel.id)) && !exclude.has(rel.id));
}

function viewsOfElement(model, elementId) {
  return (model.views || []).filter((view) => (view.type === 'sequence'
    ? (view.participants || []).includes(elementId)
    : (view.nodes || []).some((node) => node.ref === elementId)));
}

function validateModel(model) {
  const diagnostics = [];
  const add = (severity, code, subject, message, supportedFixes = []) => diagnostics.push({ code: `enterprise/${code}`, severity, subject, message, supportedFixes });
  const error = (...args) => add('error', ...args);
  const warning = (...args) => add('warning', ...args);

  if (!model || typeof model !== 'object' || Array.isArray(model)) {
    error('model-shape', {}, 'The model must be a JSON object.', ['Start from enterprise/examples/order-to-cash.enterprise.json.']);
    return { ok: false, diagnostics };
  }
  if (model.schema_version !== 1) error('schema-version', {}, 'schema_version must be 1.', ['Set "schema_version": 1.']);
  if (model.model_type !== 'enterprise') error('model-type', {}, 'model_type must be "enterprise".', ['Set "model_type": "enterprise".']);
  if (!model.meta || typeof model.meta.title !== 'string' || !model.meta.title.trim()) error('meta-title', {}, 'meta.title is required.', ['Add a non-empty meta.title.']);
  for (const key of ['elements', 'relationships', 'views']) {
    if (model[key] !== undefined && !Array.isArray(model[key])) error('model-shape', { key }, `${key} must be an array.`, [`Make ${key} an array.`]);
  }
  const elements = Array.isArray(model.elements) ? model.elements : [];
  const relationships = Array.isArray(model.relationships) ? model.relationships : [];
  const views = Array.isArray(model.views) ? model.views : [];

  const seen = new Map();
  const claim = (id, where) => {
    if (typeof id !== 'string' || !ID.test(id)) {
      error('id-format', { id, where }, `${where} id ${JSON.stringify(id)} must start with a letter and use letters, digits, "_" or "-".`, ['Rename the id.']);
      return false;
    }
    if (seen.has(id)) {
      error('duplicate-id', { id, where }, `Id "${id}" is used by both ${seen.get(id)} and ${where}.`, ['Give every element, relationship, and view a unique id.']);
      return false;
    }
    seen.set(id, where);
    return true;
  };

  const elementIds = new Set();
  for (const element of elements) {
    if (!element || typeof element !== 'object') { error('model-shape', {}, 'Every element must be an object.'); continue; }
    if (claim(element.id, 'element')) elementIds.add(element.id);
    if (!KINDS[element.kind]) error('unknown-kind', { element: element.id, kind: element.kind }, `Element "${element.id}" has unknown kind ${JSON.stringify(element.kind)}.`, ['Use a kind from enterprise/lib/notation.mjs KINDS.']);
    const control = ['gateway', 'bar', 'event'].includes(KINDS[element.kind]?.shape);
    if (typeof element.label !== 'string' || (!element.label.trim() && !control)) error('element-label', { element: element.id }, `Element "${element.id}" needs a label.`, ['Add a non-empty label.']);
    if (element.tone !== undefined && !TONES.includes(element.tone)) error('unknown-tone', { element: element.id, tone: element.tone }, `Element "${element.id}" has unknown tone ${JSON.stringify(element.tone)}.`, [`Use one of: ${TONES.join(', ')}.`]);
    for (const key of ['attributes', 'methods', 'operations']) {
      if (element[key] === undefined) continue;
      if (!Array.isArray(element[key]) || element[key].some((member) => !member || typeof member.name !== 'string' && key !== 'operations')) {
        error('member-shape', { element: element.id, key }, `Element "${element.id}" ${key} must be an array of objects with a name.`, ['Give every member a name.']);
      }
    }
    if ((element.attributes || element.methods) && KINDS[element.kind] && !isClassifier(element.kind) && element.kind !== 'data-object' && element.kind !== 'business-object') {
      warning('members-ignored', { element: element.id }, `Element "${element.id}" is a ${element.kind}; its attributes and methods are not drawn or generated.`, ['Use a classifier kind such as class, interface, enum, record, or entity.']);
    }
  }

  const relIds = new Set();
  for (const rel of relationships) {
    if (!rel || typeof rel !== 'object') { error('model-shape', {}, 'Every relationship must be an object.'); continue; }
    if (claim(rel.id, 'relationship')) relIds.add(rel.id);
    if (!RELATIONS[rel.kind]) error('unknown-relationship', { relationship: rel.id, kind: rel.kind }, `Relationship "${rel.id}" has unknown kind ${JSON.stringify(rel.kind)}.`, ['Use a kind from enterprise/lib/notation.mjs RELATIONS.']);
    for (const end of ['from', 'to']) {
      if (!elementIds.has(rel[end])) error('dangling-reference', { relationship: rel.id, end, target: rel[end] }, `Relationship "${rel.id}" ${end} "${rel[end]}" is not an element.`, ['Point the relationship at an existing element id, or add the element.']);
    }
  }

  // Generalisation must stay acyclic for code generation.
  const parents = new Map();
  for (const rel of relationships) {
    if (rel && ['inheritance', 'specialization'].includes(rel.kind)) parents.set(rel.from, [...(parents.get(rel.from) || []), rel.to]);
  }
  const state = new Map();
  const visit = (id, trail) => {
    if (state.get(id) === 2) return;
    if (state.get(id) === 1) {
      error('inheritance-cycle', { cycle: [...trail.slice(trail.indexOf(id)), id] }, `Inheritance forms a cycle: ${[...trail.slice(trail.indexOf(id)), id].join(' -> ')}.`, ['Remove one inheritance relationship from the cycle.']);
      return;
    }
    state.set(id, 1);
    for (const parent of parents.get(id) || []) visit(parent, [...trail, id]);
    state.set(id, 2);
  };
  for (const id of parents.keys()) visit(id, []);

  const placedAnywhere = new Set();
  for (const view of views) {
    if (!view || typeof view !== 'object') { error('model-shape', {}, 'Every view must be an object.'); continue; }
    claim(view.id, 'view');
    if (!VIEW_TYPES[view.type]) { error('unknown-view-type', { view: view.id, type: view.type }, `View "${view.id}" has unknown type ${JSON.stringify(view.type)}.`, [`Use one of: ${Object.keys(VIEW_TYPES).join(', ')}.`]); continue; }
    if (typeof view.title !== 'string' || !view.title.trim()) error('view-title', { view: view.id }, `View "${view.id}" needs a title.`, ['Add a non-empty title.']);
    if (view.type === 'sequence') {
      const participants = Array.isArray(view.participants) ? view.participants : [];
      if (participants.length < 2) error('sequence-participants', { view: view.id }, `Sequence view "${view.id}" needs at least two participants.`, ['List two or more element ids in participants.']);
      for (const ref of participants) {
        if (!elementIds.has(ref)) error('dangling-reference', { view: view.id, target: ref }, `View "${view.id}" participant "${ref}" is not an element.`, ['Use an existing element id.']);
        placedAnywhere.add(ref);
      }
      const messages = Array.isArray(view.messages) ? view.messages : [];
      if (!messages.length) error('sequence-messages', { view: view.id }, `Sequence view "${view.id}" needs at least one message.`, ['Add a message with from, to, and label.']);
      messages.forEach((message, index) => {
        for (const end of ['from', 'to']) {
          if (!participants.includes(message?.[end])) error('sequence-message-end', { view: view.id, index, end }, `View "${view.id}" message ${index} ${end} "${message?.[end]}" is not a participant.`, ['Add the element to participants or fix the id.']);
        }
        if (message?.kind !== undefined && !MESSAGE_KINDS.includes(message.kind)) error('sequence-message-kind', { view: view.id, index }, `View "${view.id}" message ${index} kind must be one of ${MESSAGE_KINDS.join(', ')}.`, ['Fix the message kind.']);
      });
      for (const fragment of view.fragments || []) {
        if (!(Number.isInteger(fragment?.from) && Number.isInteger(fragment?.to) && fragment.from >= 0 && fragment.to >= fragment.from && fragment.to < messages.length)) {
          error('sequence-fragment-range', { view: view.id, fragment: fragment?.label }, `View "${view.id}" fragment range must be message indexes within 0..${messages.length - 1}.`, ['Set from and to to existing message indexes.']);
        }
      }
      continue;
    }
    if (!GRID_VIEWS.includes(view.type)) continue;
    const nodes = Array.isArray(view.nodes) ? view.nodes : [];
    if (!nodes.length) error('view-empty', { view: view.id }, `View "${view.id}" places no nodes.`, ['Add nodes with ref, row, and col.']);
    const cells = new Map();
    const inView = new Set();
    for (const node of nodes) {
      if (!elementIds.has(node?.ref)) { error('dangling-reference', { view: view.id, target: node?.ref }, `View "${view.id}" places "${node?.ref}", which is not an element.`, ['Use an existing element id.']); continue; }
      if (inView.has(node.ref)) error('duplicate-placement', { view: view.id, element: node.ref }, `View "${view.id}" places "${node.ref}" twice.`, ['Place each element once per view.']);
      inView.add(node.ref);
      placedAnywhere.add(node.ref);
      if (!(Number.isFinite(node.row) && Number.isFinite(node.col) && node.row >= 0 && node.col >= 0)) {
        error('grid-cell', { view: view.id, element: node.ref }, `View "${view.id}" node "${node.ref}" needs non-negative numeric row and col.`, ['Set row and col to grid coordinates.']);
        continue;
      }
      const cell = `${node.row}:${node.col}`;
      if (cells.has(cell)) error('cell-collision', { view: view.id, cell, elements: [cells.get(cell), node.ref] }, `View "${view.id}" places "${cells.get(cell)}" and "${node.ref}" in the same cell (row ${node.row}, col ${node.col}).`, ['Move one node to a free cell.']);
      cells.set(cell, node.ref);
    }
    for (const group of view.groups || []) {
      if (!GROUP_KINDS.includes(group?.kind)) error('group-kind', { view: view.id, group: group?.label }, `View "${view.id}" group kind must be one of ${GROUP_KINDS.join(', ')}.`, ['Fix the group kind.']);
      const wraps = Array.isArray(group?.wraps) ? group.wraps : [];
      if (!wraps.length) error('group-empty', { view: view.id, group: group?.label }, `View "${view.id}" group "${group?.label}" wraps nothing.`, ['List placed element ids in wraps.']);
      for (const ref of wraps) if (!inView.has(ref)) error('group-member', { view: view.id, group: group?.label, target: ref }, `View "${view.id}" group "${group?.label}" wraps "${ref}", which is not placed in this view.`, ['Place the element in the view or remove it from wraps.']);
      if (group?.tone !== undefined && !TONES.includes(group.tone)) error('unknown-tone', { view: view.id, group: group?.label }, `View "${view.id}" group "${group?.label}" has an unknown tone.`, [`Use one of: ${TONES.join(', ')}.`]);
    }
    for (const key of ['relationships', 'exclude']) {
      for (const id of view[key] || []) if (!relIds.has(id)) error('dangling-reference', { view: view.id, target: id }, `View "${view.id}" ${key} lists "${id}", which is not a relationship.`, ['Use an existing relationship id.']);
    }
  }
  for (const id of elementIds) {
    if (!placedAnywhere.has(id)) warning('unplaced-element', { element: id }, `Element "${id}" does not appear in any view.`, ['Place it in a view or remove it from the model.']);
  }
  return { ok: !diagnostics.some((entry) => entry.severity === 'error'), diagnostics };
}

// Small naming helpers shared by the generators.
// Letters and digits of any script count, so a label such as "注文" stays a usable identifier.
const words = (text) => String(text).replace(/([a-z0-9])([A-Z])/g, '$1 $2').split(/[^\p{L}\p{N}]+/u).filter(Boolean);
const pascal = (text) => words(text).map((word) => word[0].toUpperCase() + word.slice(1)).join('') || 'Unnamed';
const camel = (text) => { const name = pascal(text); return name[0].toLowerCase() + name.slice(1); };
const snake = (text) => words(text).map((word) => word.toLowerCase()).join('_') || 'unnamed';
const kebab = (text) => words(text).map((word) => word.toLowerCase()).join('-') || 'unnamed';
const screaming = (text) => snake(text).toUpperCase();

// A generated name that is a legal identifier and not yet in `taken`. Falls
// back to the element or view id, which validation guarantees is unique ASCII.
function uniqueName(style, label, id, taken) {
  let name = words(label).length ? style(label) : style(id);
  if (/^\p{N}/u.test(name)) name = style(`n ${name}`);
  if (taken.has(name.toLowerCase())) name = style(id);
  for (let index = 2; taken.has(name.toLowerCase()); index += 1) name = style(`${id} ${index}`);
  taken.add(name.toLowerCase());
  return name;
}

// ---- lib/layout.mjs ----
// Deterministic layout for enterprise views. Authors place nodes on a row/col
// grid (the same authored-grid contract as Archify's native renderers); this
// module sizes nodes from their text, positions bands and groups, and routes
// relationships orthogonally around the placed nodes.


const FONT = { label: 12, caption: 9.5, member: 10.5, edge: 9.5, title: 15 };
const MARGIN = 36;
const TITLE_H = 46;
const LANE_STRIP = 26;

// JetBrains Mono advances 0.6em per Latin glyph; wide scripts take a full em.
function textWidth(text, size) {
  let units = 0;
  for (const char of String(text)) units += char.codePointAt(0) > 0x2e7f ? 1 : 0.6;
  return units * size;
}

function wrapText(text, maxWidth, size, maxLines = 3) {
  const out = [];
  let line = '';
  for (const word of String(text).split(/\s+/).filter(Boolean)) {
    const next = line ? `${line} ${word}` : word;
    if (!line || textWidth(next, size) <= maxWidth) line = next;
    else { out.push(line); line = word; }
  }
  if (line) out.push(line);
  if (out.length > maxLines) {
    const kept = out.slice(0, maxLines);
    kept[maxLines - 1] = `${kept[maxLines - 1].replace(/.$/, '')}…`;
    return kept;
  }
  return out.length ? out : [''];
}

function clip(text, maxWidth, size) {
  const value = String(text);
  if (textWidth(value, size) <= maxWidth) return value;
  let out = '';
  for (const char of value) {
    if (textWidth(`${out}${char}…`, size) > maxWidth) break;
    out += char;
  }
  return `${out}…`;
}

const VISIBILITY = { public: '+', protected: '#', package: '~', private: '-' };
function attributeText(attribute) {
  const marks = `${attribute.pk ? ' {pk}' : ''}${attribute.unique ? ' {unique}' : ''}`;
  return `${VISIBILITY[attribute.visibility] || '+'} ${attribute.name}${attribute.type ? `: ${attribute.type}` : ''}${marks}`;
}
function methodText(method) {
  return `${VISIBILITY[method.visibility] || '+'} ${method.name}(${method.parameters || ''})${method.returns ? `: ${method.returns}` : ''}`;
}

function measureNode(element, placement) {
  const spec = KINDS[element.kind];
  const shape = spec.shape;
  const node = { id: element.id, element, kind: element.kind, spec, shape, tone: toneOf(element), below: 0, lines: [], caption: element.sublabel || element.tech || '' };
  if (shape === 'classifier') {
    const attributes = (element.attributes || []).map((attribute) => (element.kind === 'enum' ? attribute.name : attributeText(attribute)));
    const methods = (element.methods || []).map(methodText);
    const widest = Math.max(textWidth(element.label, FONT.label) + 28, ...[...attributes, ...methods].map((text) => textWidth(text, FONT.member) + 22), spec.stereotype ? textWidth(`«${spec.stereotype}»`, FONT.caption) + 28 : 0);
    node.w = Math.min(320, Math.max(168, Math.ceil(widest)));
    node.headerH = spec.stereotype ? 40 : 30;
    node.attributes = attributes.map((text) => clip(text, node.w - 20, FONT.member));
    node.methods = methods.map((text) => clip(text, node.w - 20, FONT.member));
    const compartment = (rows) => (rows.length ? rows.length * 15 + 9 : 0);
    node.attrH = compartment(node.attributes);
    node.methH = compartment(node.methods);
    node.h = node.headerH + node.attrH + node.methH + (node.attrH + node.methH ? 0 : 8);
    node.lines = [element.label];
  } else if (shape === 'event') {
    node.w = 36; node.h = 36;
    node.lines = element.kind === 'initial' || element.kind === 'final' ? [] : wrapText(element.label, 116, FONT.caption + 0.5, 2);
    node.below = node.lines.length * 12 + (node.lines.length ? 5 : 0);
  } else if (shape === 'gateway') {
    node.w = 44; node.h = 44;
    node.lines = wrapText(element.label, 116, FONT.caption + 0.5, 2);
    node.below = node.lines.length * 12 + 5;
  } else if (shape === 'bar') {
    const horizontal = placement.orient === 'h';
    node.w = horizontal ? 104 : 8; node.h = horizontal ? 8 : 72;
  } else if (shape === 'actor') {
    node.w = 36; node.h = 54;
    node.lines = wrapText(element.label, 116, FONT.label, 2);
    node.below = node.lines.length * 14 + 4;
  } else {
    const maxW = shape === 'ellipse' ? 150 : 148;
    node.lines = wrapText(element.label, maxW, FONT.label, 3);
    const textW = Math.max(...node.lines.map((line) => textWidth(line, FONT.label)), node.caption ? Math.min(150, textWidth(node.caption, FONT.caption)) : 0);
    const marked = spec.glyph !== 'none' || (element.kind === 'task' && element.taskType);
    const pad = shape === 'ellipse' ? 52 : marked ? 58 : 40;
    node.w = Math.max(132, Math.ceil(textW + pad));
    node.caption = node.caption ? clip(node.caption, node.w - 24, FONT.caption) : '';
    node.h = Math.max(56, 28 + node.lines.length * 15 + (node.caption ? 14 : 0) + (shape === 'node3d' ? 6 : 0) + (shape === 'ellipse' && marked ? 14 : 0));
  }
  if (Number.isFinite(placement.w)) node.w = placement.w;
  if (Number.isFinite(placement.h)) node.h = placement.h;
  return node;
}

function bands(nodes, axis, size, extra, gap, start) {
  const key = axis === 'x' ? 'col' : 'row';
  const count = Math.max(0, ...nodes.map((node) => Math.ceil(node[key]))) + 1;
  const sizes = Array.from({ length: count }, () => 0);
  for (const node of nodes) {
    if (Number.isInteger(node[key])) sizes[node[key]] = Math.max(sizes[node[key]], node[size] + 2 * (extra ? node.below : 0));
  }
  const out = [];
  let cursor = start;
  for (let index = 0; index < count; index += 1) {
    const length = sizes[index] || (axis === 'x' ? 56 : 28);
    out.push({ start: cursor, end: cursor + length, mid: cursor + length / 2 });
    cursor += length + gap;
  }
  return out;
}

const lerp = (a, b, t) => a + (b - a) * t;
function bandPosition(list, value) {
  const low = Math.floor(value);
  if (low === value) return list[low];
  const high = list[Math.min(list.length - 1, low + 1)];
  const mid = lerp(list[low].mid, high.mid, value - low);
  return { start: null, end: null, mid };
}

// ---- Routing --------------------------------------------------------------

const fixedPort = (node) => node.shape === 'event' || node.shape === 'gateway';

function hits(points, obstacles, skip) {
  let count = 0;
  for (const rect of obstacles) {
    if (skip.has(rect.id)) continue;
    const x0 = rect.x - 5; const x1 = rect.x + rect.w + 5; const y0 = rect.y - 5; const y1 = rect.y + rect.h + rect.below + 5;
    for (let index = 0; index < points.length - 1; index += 1) {
      const [ax, ay] = points[index]; const [bx, by] = points[index + 1];
      if (Math.max(ax, bx) > x0 && Math.min(ax, bx) < x1 && Math.max(ay, by) > y0 && Math.min(ay, by) < y1) { count += 1; break; }
    }
  }
  return count;
}

function buildPoints(route, a, b) {
  const pa = portPoint(a, route.fromSide, route.fromOffset || 0);
  const pb = portPoint(b, route.toSide, route.toOffset || 0);
  const points = [pa];
  if (route.shape === 'HVH') points.push([route.channel, pa[1]], [route.channel, pb[1]]);
  else if (route.shape === 'VHV') points.push([pa[0], route.channel], [pb[0], route.channel]);
  else if (route.shape === 'HV') points.push([pb[0], pa[1]]);
  else if (route.shape === 'VH') points.push([pa[0], pb[1]]);
  points.push(pb);
  return simplify(points);
}

function simplify(points) {
  const out = [];
  for (const point of points) {
    const last = out[out.length - 1];
    if (last && Math.abs(last[0] - point[0]) < 0.5 && Math.abs(last[1] - point[1]) < 0.5) continue;
    if (out.length >= 2) {
      const prev = out[out.length - 2];
      const collinear = (Math.abs(prev[0] - last[0]) < 0.5 && Math.abs(last[0] - point[0]) < 0.5) || (Math.abs(prev[1] - last[1]) < 0.5 && Math.abs(last[1] - point[1]) < 0.5);
      if (collinear) out.pop();
    }
    out.push(point);
  }
  return out;
}

function portPoint(node, side, offset) {
  if (side === 'left') return [node.x, node.cy + offset];
  if (side === 'right') return [node.x + node.w, node.cy + offset];
  if (side === 'top') return [node.cx + offset, node.y];
  return [node.cx + offset, node.y + node.h];
}

function candidates(a, b, gapX, gapY) {
  const dx = b.cx - a.cx; const dy = b.cy - a.cy;
  const sameRow = Math.abs(dy) < 2; const sameCol = Math.abs(dx) < 2;
  const out = [];
  const h = dx >= 0 ? ['right', 'left'] : ['left', 'right'];
  const v = dy >= 0 ? ['bottom', 'top'] : ['top', 'bottom'];
  if (!sameCol) {
    const nearA = dx >= 0 ? a.cell.x1 + gapX / 2 : a.cell.x0 - gapX / 2;
    const nearB = dx >= 0 ? b.cell.x0 - gapX / 2 : b.cell.x1 + gapX / 2;
    for (const channel of new Set([nearA, nearB])) out.push({ shape: 'HVH', fromSide: h[0], toSide: h[1], channel, bends: sameRow ? 0 : 2 });
  }
  if (!sameRow) {
    const nearA = dy >= 0 ? a.cell.y1 + gapY / 2 : a.cell.y0 - gapY / 2;
    const nearB = dy >= 0 ? b.cell.y0 - gapY / 2 : b.cell.y1 + gapY / 2;
    for (const channel of new Set([nearA, nearB])) out.push({ shape: 'VHV', fromSide: v[0], toSide: v[1], channel, bends: sameCol ? 0 : 2 });
  }
  if (!sameRow && !sameCol) {
    out.push({ shape: 'HV', fromSide: h[0], toSide: v[1], bends: 1 });
    out.push({ shape: 'VH', fromSide: v[0], toSide: h[1], bends: 1 });
  }
  // Detours that leave and re-enter on the same side: loops back along a row
  // or column, and the escape hatch when the direct corridor is occupied.
  const top = Math.min(a.cell.y0, b.cell.y0) - gapY / 2; const bottom = Math.max(a.cell.y1, b.cell.y1) + gapY / 2;
  const left = Math.min(a.cell.x0, b.cell.x0) - gapX / 2; const right = Math.max(a.cell.x1, b.cell.x1) + gapX / 2;
  if (!sameCol) {
    out.push({ shape: 'VHV', fromSide: 'top', toSide: 'top', channel: top, bends: 2, detour: true });
    out.push({ shape: 'VHV', fromSide: 'bottom', toSide: 'bottom', channel: bottom, bends: 2, detour: true });
  }
  if (!sameRow) {
    out.push({ shape: 'HVH', fromSide: 'left', toSide: 'left', channel: left, bends: 2, detour: true });
    out.push({ shape: 'HVH', fromSide: 'right', toSide: 'right', channel: right, bends: 2, detour: true });
  }
  return out;
}

const VERTICAL_KINDS = new Set(['inheritance', 'specialization', 'realization']);
const FLOW_VIEWS = new Set(['bpmn', 'activity', 'state']);

function routeEdges(view, nodes, rels, gapX, gapY) {
  const byId = new Map(nodes.map((node) => [node.id, node]));
  const authored = view.routes || {};
  const edges = [];
  const loops = [];
  const usedPairs = new Map();
  for (const rel of rels) {
    const a = byId.get(rel.from); const b = byId.get(rel.to);
    if (!a || !b) continue;
    if (a === b) {
      // A self-relationship leaves the right side and re-enters the top.
      const nth = loops.filter((loop) => loop.from === a.id).length;
      const reach = 22 + nth * 10; const inset = Math.min(a.w / 2 - 4, 14 + nth * 10);
      const y = a.cy - Math.min(a.h / 2 - 4, 8 + nth * 8); const x = a.x + a.w - inset;
      loops.push({ id: rel.id, rel, from: a.id, to: a.id, points: [[a.x + a.w, y], [a.x + a.w + reach, y], [a.x + a.w + reach, a.y - reach + 4], [x, a.y - reach + 4], [x, a.y]] });
      continue;
    }
    const skip = new Set([a.id, b.id]);
    const choose = (want) => {
     let best = null;
     for (const option of candidates(a, b, gapX, gapY)) {
      if ((want.fromSide && want.fromSide !== option.fromSide) || (want.toSide && want.toSide !== option.toSide)) continue;
      const points = buildPoints(option, a, b);
      const length = points.slice(1).reduce((sum, point, index) => sum + Math.abs(point[0] - points[index][0]) + Math.abs(point[1] - points[index][1]), 0);
      const vertical = option.fromSide === 'top' || option.fromSide === 'bottom';
      let bias = 0;
      if (VERTICAL_KINDS.has(rel.kind) && !(vertical && (option.toSide === 'top' || option.toSide === 'bottom'))) bias += 12;
      if (FLOW_VIEWS.has(view.type) && vertical && !VERTICAL_KINDS.has(rel.kind)) bias += 1.5;
      // A branch leaving a gateway for another row departs from its own vertex.
      if (fixedPort(a) && !vertical && Math.abs(b.cy - a.cy) > 2) bias += 12;
      if (fixedPort(b) && (option.toSide === 'left' || option.toSide === 'right') && Math.abs(b.cy - a.cy) > 2) bias += 12;
      if (!FLOW_VIEWS.has(view.type) && !vertical && option.bends) bias += 1.5;
      // A reverse edge between the same pair takes a different corridor.
      const pairKey = [a.id, b.id].sort().join('|');
      if (usedPairs.get(pairKey) === `${option.shape}:${[option.fromSide, option.toSide].sort().join()}` && option.bends) bias += 4;
      const score = hits(points, nodes, skip) * 1000 + option.bends * 10 + (option.detour ? 14 : 0) + bias + length / 100;
      if (!best || score < best.score) best = { ...option, score };
     }
     return best;
    };
    // Authored sides that no route can honour must not make the relationship vanish.
    const best = choose(authored[rel.id] || {}) || choose({});
    usedPairs.set([a.id, b.id].sort().join('|'), `${best.shape}:${[best.fromSide, best.toSide].sort().join()}`);
    edges.push({ id: rel.id, rel, a, b, route: best });
  }

  // Spread ports along each node side, ordered by where the far end sits.
  const sides = new Map();
  const claim = (edge, end) => {
    const node = end === 'from' ? edge.a : edge.b; const other = end === 'from' ? edge.b : edge.a;
    const side = edge.route[`${end}Side`];
    const key = `${node.id}:${side}`;
    const far = side === 'left' || side === 'right' ? other.cy : other.cx;
    if (!sides.has(key)) sides.set(key, { node, side, items: [] });
    sides.get(key).items.push({ edge, end, far });
  };
  for (const edge of edges) { claim(edge, 'from'); claim(edge, 'to'); }
  for (const { node, side, items } of sides.values()) {
    items.sort((p, q) => p.far - q.far);
    const length = side === 'left' || side === 'right' ? node.h : node.w;
    const step = fixedPort(node) ? 0 : Math.min(18, (length - Math.min(20, length / 3)) / items.length);
    items.forEach((item, index) => { item.edge.route[`${item.end}Offset`] = (index - (items.length - 1) / 2) * step; });
  }

  // Straighten near-aligned direct runs, then separate parallel channels.
  for (const edge of edges) {
    const { route, a, b } = edge;
    if (route.detour || (route.shape !== 'HVH' && route.shape !== 'VHV')) continue;
    const axis = route.shape === 'HVH' ? 'cy' : 'cx'; const span = route.shape === 'HVH' ? 'h' : 'w';
    const pa = a[axis] + route.fromOffset; const pb = b[axis] + route.toOffset;
    if (Math.abs(pa - pb) > 22 || Math.abs(pa - pb) < 0.5) continue;
    if (!fixedPort(b) && Math.abs(pa - b[axis]) < b[span] / 2 - 5) route.toOffset = pa - b[axis];
    else if (!fixedPort(a) && Math.abs(pb - a[axis]) < a[span] / 2 - 5) route.fromOffset = pb - a[axis];
  }
  const channels = new Map();
  for (const edge of edges) {
    if (edge.route.channel === undefined) continue;
    const key = `${edge.route.shape}:${Math.round(edge.route.channel)}`;
    channels.set(key, [...(channels.get(key) || []), edge]);
  }
  for (const group of channels.values()) {
    const distinct = group;
    const lanes = [];
    for (const edge of distinct) {
      const points = buildPoints(edge.route, edge.a, edge.b);
      if (points.length < 4) continue;
      const horizontal = edge.route.shape === 'VHV';
      const lo = Math.min(points[1][horizontal ? 0 : 1], points[2][horizontal ? 0 : 1]);
      const hi = Math.max(points[1][horizontal ? 0 : 1], points[2][horizontal ? 0 : 1]);
      let lane = lanes.findIndex((spans) => spans.every((span) => span.hi < lo - 4 || span.lo > hi + 4 || span.shared === edge.a.id || span.shared === edge.b.id));
      if (lane < 0) { lane = lanes.length; lanes.push([]); }
      lanes[lane].push({ lo, hi, shared: VERTICAL_KINDS.has(edge.rel.kind) ? edge.b.id : null });
      edge.lane = lane;
    }
    for (const edge of distinct) if (edge.lane !== undefined) edge.route.channel += (edge.lane - (lanes.length - 1) / 2) * 9;
  }
  return [...edges.map((edge) => ({ id: edge.id, rel: edge.rel, from: edge.a.id, to: edge.b.id, points: buildPoints(edge.route, edge.a, edge.b) })), ...loops];
}

function edgeLabelText(rel) {
  const parts = [];
  if (rel.kind === 'include' || rel.kind === 'extend' || rel.kind === 'deployment') parts.push(`«${rel.kind === 'deployment' ? 'deploy' : rel.kind}»`);
  if (rel.label) parts.push(rel.label);
  else if (rel.guard) parts.push(`[${rel.guard}]`);
  return parts.join(' ');
}

function placeLabels(edges, nodes) {
  const taken = [];
  for (const edge of edges) {
    const text = edgeLabelText(edge.rel);
    if (!text) continue;
    const w = textWidth(text, FONT.edge) + 10; const h = 15;
    const segments = edge.points.slice(1).map((point, index) => ({ a: edge.points[index], b: point, length: Math.abs(point[0] - edge.points[index][0]) + Math.abs(point[1] - edge.points[index][1]) }))
      .sort((p, q) => q.length - p.length);
    let best = null;
    for (const segment of segments) {
      for (const t of [0.5, 0.32, 0.68]) {
        const cx = lerp(segment.a[0], segment.b[0], t); const cy = lerp(segment.a[1], segment.b[1], t);
        const box = { x: cx - w / 2, y: cy - h / 2, w, h };
        const clash = [...nodes.map((node) => ({ x: node.x, y: node.y, w: node.w, h: node.h + node.below })), ...taken]
          .filter((rect) => box.x < rect.x + rect.w + 2 && box.x + box.w > rect.x - 2 && box.y < rect.y + rect.h + 2 && box.y + box.h > rect.y - 2).length;
        const score = clash * 100 + (segment.length < w + 12 ? 20 : 0) + Math.abs(t - 0.5);
        if (!best || score < best.score) best = { score, box };
      }
    }
    edge.label = { text, ...best.box };
    taken.push(best.box);
  }
}

// ---- Grid views -----------------------------------------------------------

function layoutGrid(model, view) {
  const { elements } = indexModel(model);
  const gapX = view.layout?.gapX ?? (view.type === 'class' ? 96 : 72);
  const gapY = view.layout?.gapY ?? 68;
  const lanes = (view.groups || []).filter((group) => group.kind === 'lane' || group.kind === 'pool');
  const nodes = (view.nodes || []).filter((placement) => elements.has(placement.ref))
    .map((placement) => ({ ...measureNode(elements.get(placement.ref), placement), row: placement.row, col: placement.col }));
  const left = MARGIN + (lanes.length ? LANE_STRIP + 14 : 0);
  const cols = bands(nodes, 'x', 'w', false, gapX, left);
  const framed = (view.groups || []).some((group) => !lanes.includes(group));
  const rows = bands(nodes, 'y', 'h', true, gapY, MARGIN + TITLE_H + (lanes.length ? 8 : 0) + (framed ? 44 : 0));
  for (const node of nodes) {
    const col = bandPosition(cols, node.col); const row = bandPosition(rows, node.row);
    node.cx = col.mid; node.cy = row.mid;
    node.x = node.cx - node.w / 2; node.y = node.cy - node.h / 2;
    node.cell = {
      x0: col.start ?? node.x, x1: col.end ?? node.x + node.w,
      y0: row.start ?? node.y, y1: row.end ?? node.y + node.h + node.below,
    };
  }
  const byId = new Map(nodes.map((node) => [node.id, node]));
  const right = cols[cols.length - 1].end;
  const groups = [];
  const others = (view.groups || []).filter((group) => !lanes.includes(group));
  for (const group of view.groups || []) {
    const members = (group.wraps || []).map((ref) => byId.get(ref)).filter(Boolean);
    if (!members.length) continue;
    if (lanes.includes(group)) {
      const y0 = Math.min(...members.map((node) => node.cell.y0)) - gapY / 2 + 4;
      const y1 = Math.max(...members.map((node) => node.cell.y1)) + gapY / 2 - 4;
      groups.push({ ...group, x: MARGIN, y: y0, w: right - MARGIN + 18, h: y1 - y0, strip: LANE_STRIP });
    } else {
      const nested = others.filter((other) => other !== group && (other.wraps || []).length < (group.wraps || []).length && (other.wraps || []).every((ref) => (group.wraps || []).includes(ref))).length;
      const pad = 14 + nested * 12;
      const x0 = Math.min(...members.map((node) => node.x)) - pad; const x1 = Math.max(...members.map((node) => node.x + node.w)) + pad;
      const y0 = Math.min(...members.map((node) => node.y)) - pad - 16; const y1 = Math.max(...members.map((node) => node.y + node.h + node.below)) + pad;
      groups.push({ ...group, x: x0, y: y0, w: x1 - x0, h: y1 - y0, depth: nested });
    }
  }
  groups.sort((p, q) => q.w * q.h - p.w * p.h);
  const edges = routeEdges(view, nodes, viewRelationships(model, view), gapX, gapY);
  placeLabels(edges, nodes);
  const extents = [
    ...nodes.map((node) => {
      const half = node.below ? Math.max(node.w / 2, ...node.lines.map((line) => textWidth(line, FONT.label) / 2)) : node.w / 2;
      return [node.cx - half, node.y, node.cx + half, node.y + node.h + node.below];
    }),
    ...groups.map((group) => [group.x, group.y, group.x + group.w, group.y + group.h]),
    ...edges.flatMap((edge) => [...edge.points.map(([x, y]) => [x - 8, y - 8, x + 8, y + 8]), ...(edge.label ? [[edge.label.x, edge.label.y, edge.label.x + edge.label.w, edge.label.y + edge.label.h]] : [])]),
  ];
  const minX = Math.min(MARGIN, ...extents.map((rect) => rect[0] - 12));
  const minY = Math.min(0, ...extents.map((rect) => rect[1] - 12));
  const width = Math.max(520, ...extents.map((rect) => rect[2])) + MARGIN - Math.min(0, minX);
  const height = Math.max(...extents.map((rect) => rect[3])) + MARGIN - minY;

function layoutSequence(model, view) {

    const inside = messages.filter((message) => message.index >= fragment.from && message.index <= fragment.to);

function layoutView(model, view) {
  return view.type === 'sequence' ? layoutSequence(model, view) : layoutGrid(model, view);

function roundedPath(points, radius = 6) {
