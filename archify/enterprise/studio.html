  for (const fragment of layout.fragments) {
    const tabW = textWidth(fragment.kind || 'alt', 9) * 1.15 + 18;
    parts.push(`<g class="ea-fragment-wrap"><rect class="ea-fragment" x="${n(fragment.x)}" y="${n(fragment.y)}" width="${n(fragment.w)}" height="${n(fragment.h)}" rx="3"/><path class="ea-fragment-tab" d="M${n(fragment.x)} ${n(fragment.y)}h${n(tabW)}v10l-6 6H${n(fragment.x)}Z"/><text class="ea-group-label" x="${n(fragment.x + 7)}" y="${n(fragment.y + 8)}" dominant-baseline="central">${esc(fragment.kind || 'alt')}</text>${fragment.label ? `<text class="ea-cap" x="${n(fragment.x + tabW + 8)}" y="${n(fragment.y + 8)}" dominant-baseline="central">[${esc(fragment.label)}]</text>` : ''}</g>`);
  }
  for (const participant of layout.participants) {
    parts.push(`<path class="ea-lifeline" d="M${n(participant.cx)} ${n(participant.y + participant.h)}V${n(layout.lifelineBottom)}"/>`);
  }
  const tones = new Map(layout.participants.map((participant) => [participant.id, participant.tone]));
  for (const activation of layout.activations) {
    const participant = layout.participants.find((entry) => entry.id === activation.participant);
    parts.push(`<rect class="ea-activation t-${tones.get(activation.participant)}" x="${n(participant.cx - 5)}" y="${n(activation.from)}" width="10" height="${n(Math.max(12, activation.to - activation.from))}" rx="2"/>`);
  }
  for (const participant of layout.participants) {
    const node = { ...participant, shape: participant.spec.shape === 'actor' ? 'box' : ['box', 'round', 'sheet', 'chamfer'].includes(participant.spec.shape) ? participant.spec.shape : 'box', caption: '', below: 0 };
    parts.push(drawNode(node));
  }
  for (const message of layout.messages) {
    const cls = `ea-line${message.kind === 'reply' ? ' ea-dashed' : ''}`;
    const tip = message.kind === 'sync' || message.kind === 'self' ? 'filled' : 'open';
    let body;
    if (message.kind === 'self') {
      const x = message.x1 + 5;
      body = `<path class="${cls}" d="M${n(x)} ${n(message.y)}h30v20h-30"/>${marker(tip, [x, message.y + 20], [x + 30, message.y + 20])}<text class="ea-mult" x="${n(x + 38)}" y="${n(message.y + 10)}" dominant-baseline="central">${esc(message.label)}</text>`;
    } else {
      const dir = Math.sign(message.x2 - message.x1);
      const x1 = message.x1 + dir * 5; const x2 = message.x2 - dir * 5;
      body = `<path class="${cls}" d="M${n(x1)} ${n(message.y)}H${n(x2)}"/>${marker(tip, [x2, message.y], [x1, message.y])}<text class="ea-mult" x="${n((x1 + x2) / 2)}" y="${n(message.y - 9)}" text-anchor="middle" dominant-baseline="central">${esc(message.label)}</text>`;
    }
    parts.push(`<g class="ea-edge" data-message="${message.index}" data-from="${esc(message.from)}" data-to="${esc(message.to)}" data-kind="${message.kind}"><title>${esc(`${message.from} → ${message.to}: ${message.label}`)}</title>${body}</g>`);
  }
  return parts.join('');
}

function legendFor(model, view, layout) {
  const kinds = layout.kind === 'sequence' ? [] : [...new Set(layout.edges.map((edge) => edge.rel.kind))];
  return kinds.map((kind) => ({ kind, ...RELATIONS[kind] }));
}

function drawLegend(entries, x, y, maxWidth) {
  const parts = [];
  let cx = x; let cy = y;
  for (const entry of entries) {
    const width = 46 + 8 + textWidth(entry.label, 9) * 1.12 + 20;
    if (cx + width > x + maxWidth && cx > x) { cx = x; cy += 20; }
    const dash = entry.dash === 'solid' ? '' : ` ea-${entry.dash}`;
    parts.push(`<g class="ea-edge ea-legend-item" data-legend="${esc(entry.kind)}"><path class="ea-line${dash}" d="M${n(cx)} ${n(cy)}H${n(cx + 46)}"/>${marker(entry.start, [cx, cy], [cx + 46, cy])}${marker(entry.end, [cx + 46, cy], [cx, cy])}<text class="ea-cap" x="${n(cx + 54)}" y="${n(cy)}" dominant-baseline="central">${esc(entry.label)}</text></g>`);
    cx += width;
  }
  return { markup: parts.join(''), height: entries.length ? cy - y + 22 : 0 };
}

function renderView(model, viewId, options = {}) {
  const view = (model.views || []).find((entry) => entry.id === viewId);
  if (!view) throw new Error(`Unknown view "${viewId}"`);
  const layout = layoutView(model, view);
  const theme = options.theme || 'dark';
  const legendEntries = options.legend === false ? [] : legendFor(model, view, layout);
  const legend = drawLegend(legendEntries, 36, layout.height + 4, layout.width - 72);
  const width = Math.ceil(layout.width + layout.shiftX); const height = Math.ceil(layout.height + layout.shiftY + legend.height + (legend.height ? 14 : 0));
  const body = layout.kind === 'sequence'
    ? drawSequence(layout)
    : `${layout.groups.map(drawGroup).join('')}<g class="ea-edges">${layout.edges.map(drawEdge).join('')}</g><g class="ea-nodes">${layout.nodes.map(drawNode).join('')}</g>`;
  const kicker = [VIEW_TYPES[view.type].label, view.viewpoint].filter(Boolean).join(' · ');
  const svg = `<svg class="ea-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" data-theme="${esc(theme)}" data-view="${esc(view.id)}" data-view-type="${esc(view.type)}" role="img" aria-label="${esc(view.title)}">
<style>${svgStyles()}</style>
<rect class="ea-canvas" width="${width}" height="${height}" fill="var(--bg)"/>
<text class="ea-kicker" x="36" y="30" dominant-baseline="central">${esc(kicker)}</text>
<text class="ea-title" x="36" y="50" dominant-baseline="central">${esc(view.title)}</text>
<g transform="translate(${n(layout.shiftX)} ${n(layout.shiftY)})">${body}<g class="ea-tokens"></g></g>
<g class="ea-legend" transform="translate(${n(layout.shiftX)} ${n(layout.shiftY)})">${legend.markup}</g>
</svg>`;
  return { svg, width, height, layout, legend: legendEntries };
}

// ---- lib/codegen.mjs ----
// Code generation from the enterprise model. Every target returns
// `[{ path, content }]`; nothing touches the filesystem here, so the same code
// runs in the CLI and in the Studio.


const CODE_TARGETS = {
  typescript: { label: 'TypeScript', hint: 'Domain types from classifiers' },
  java: { label: 'Java', hint: 'Domain types from classifiers' },
  python: { label: 'Python', hint: 'Dataclasses, protocols, enums' },
  sql: { label: 'SQL DDL', hint: 'Tables and keys from entities' },
  openapi: { label: 'OpenAPI', hint: 'Paths from application interfaces' },
  statemachine: { label: 'State machines', hint: 'Transition tables from state views' },
  bpmn: { label: 'BPMN 2.0 XML', hint: 'Opens in bpmn.io and Camunda Modeler' },
  archimate: { label: 'ArchiMate exchange', hint: 'Opens in Archi, Sparx EA, Visual Paradigm' },
};

const xml = (value) => String(value ?? '').replace(/[&<>"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[char]));
const header = (model, comment) => `${comment} Generated by Archify Enterprise from "${model.meta?.title || 'model'}". Regenerate instead of editing by hand.`;

// ---- Shared classifier model ----------------------------------------------

const PRIMITIVES = {
  string: { ts: 'string', java: 'String', py: 'str', sql: 'TEXT', oas: { type: 'string' } },
  text: { ts: 'string', java: 'String', py: 'str', sql: 'TEXT', oas: { type: 'string' } },
  int: { ts: 'number', java: 'int', py: 'int', sql: 'INTEGER', oas: { type: 'integer' } },
  integer: { ts: 'number', java: 'int', py: 'int', sql: 'INTEGER', oas: { type: 'integer' } },
  long: { ts: 'number', java: 'long', py: 'int', sql: 'BIGINT', oas: { type: 'integer', format: 'int64' } },
  float: { ts: 'number', java: 'double', py: 'float', sql: 'DOUBLE PRECISION', oas: { type: 'number' } },
  double: { ts: 'number', java: 'double', py: 'float', sql: 'DOUBLE PRECISION', oas: { type: 'number' } },
  decimal: { ts: 'string', java: 'java.math.BigDecimal', py: 'Decimal', sql: 'NUMERIC(18, 2)', oas: { type: 'string', format: 'decimal' } },
  boolean: { ts: 'boolean', java: 'boolean', py: 'bool', sql: 'BOOLEAN', oas: { type: 'boolean' } },
  bool: { ts: 'boolean', java: 'boolean', py: 'bool', sql: 'BOOLEAN', oas: { type: 'boolean' } },
  uuid: { ts: 'string', java: 'java.util.UUID', py: 'UUID', sql: 'UUID', oas: { type: 'string', format: 'uuid' } },
  date: { ts: 'string', java: 'java.time.LocalDate', py: 'date', sql: 'DATE', oas: { type: 'string', format: 'date' } },
  datetime: { ts: 'string', java: 'java.time.Instant', py: 'datetime', sql: 'TIMESTAMPTZ', oas: { type: 'string', format: 'date-time' } },
  void: { ts: 'void', java: 'void', py: 'None', sql: 'TEXT', oas: {} },
  any: { ts: 'unknown', java: 'Object', py: 'Any', sql: 'JSONB', oas: {} },
};

function parseType(raw) {
  const text = String(raw || 'any').trim();
  const list = text.match(/^(?:List|Array|Set)<(.+)>$/i) || text.match(/^(.+)\[\]$/);
  return list ? { base: list[1].trim(), many: true } : { base: text, many: false };
}

function typeName(raw, lang, types) {
  const { base, many } = parseType(raw);
  const primitive = PRIMITIVES[base.toLowerCase()];
  const known = types.find((type) => type.name === base || type.id === base);
  const name = primitive && !known ? primitive[lang] : known ? known.name : base;
  if (!many) return name;
  if (lang === 'ts') return `${name}[]`;
  if (lang === 'java') return `java.util.List<${boxed(name)}>`;
  return `list[${name}]`;
}
const boxed = (name) => ({ int: 'Integer', long: 'Long', double: 'Double', boolean: 'Boolean' }[name] || name);

function parseParameters(raw) {
  return String(raw || '').split(',').map((part) => part.trim()).filter(Boolean).map((part) => {
    const [name, ...rest] = part.split(':');
    return { name: name.trim(), type: rest.join(':').trim() || 'any' };
  });
}

function many(multiplicity) {
  return /\*|\.\.(?!1$)|^[2-9]|^\d{2,}/.test(String(multiplicity || ''));
}

// Classifiers with resolved supertypes, realised interfaces, and the fields
// implied by composition, aggregation, and association ends.
function classifierModel(model) {
  const elements = (model.elements || []).filter((element) => isClassifier(element.kind));
  const taken = new Set();
  const types = elements.map((element) => ({ id: element.id, name: uniqueName(pascal, element.label, element.id, taken), kind: element.kind, element, doc: element.doc || '', extends: [], implements: [], fields: [], methods: element.methods || [], references: [] }));
  const byId = new Map(types.map((type) => [type.id, type]));
  for (const type of types) {
    for (const attribute of type.element.attributes || []) type.fields.push({ ...attribute, type: attribute.type || 'any', source: 'attribute' });
  }
  for (const rel of model.relationships || []) {
    const from = byId.get(rel.from); const to = byId.get(rel.to);
    if (!from || !to) continue;
    if (rel.kind === 'inheritance' || rel.kind === 'specialization') from.extends.push(to);
    else if (rel.kind === 'realization') from.implements.push(to);
    else if (['composition', 'aggregation', 'association'].includes(rel.kind)) {
      const isMany = many(rel.toMult);
      // An attribute that already names or holds the target is the authored
      // field. Otherwise every relationship gets its own field, so two
      // associations to one type (billing and shipping address) both survive.
      const base = rel.role || (isMany ? `${camel(to.name)}s` : camel(to.name));
      const declared = from.fields.some((field) => field.source === 'attribute' && (field.name === base || (!rel.role && parseType(field.type).base === to.name)));
      if (!declared) {
        let name = base;
        for (let index = 2; from.fields.some((field) => field.name === name); index += 1) name = `${base}${index}`;
        from.fields.push({ name, type: isMany ? `${to.name}[]` : to.name, visibility: 'public', nullable: /^0/.test(String(rel.toMult || '')) && !isMany, source: rel.kind, relationship: rel.id });
      }
      from.references.push({ rel, to });
    }
  }
  return types;
}

function referenced(type, types) {
  const names = new Set();
  const note = (raw) => { const { base } = parseType(raw); const hit = types.find((other) => other.name === base || other.id === base); if (hit && hit !== type) names.add(hit.name); };
  for (const field of type.fields) note(field.type);
  for (const method of type.methods) { note(method.returns); for (const parameter of parseParameters(method.parameters)) note(parameter.type); }
  for (const parent of [...type.extends, ...type.implements]) names.add(parent.name);
  return [...names].sort();
}

// ---- TypeScript -----------------------------------------------------------

const isClass = (type) => type.kind === 'class' || type.kind === 'abstract';

// Enum literal names, unique within the enum and legal in every target.
function literals(type) {
  const taken = new Set();
  return type.fields.map((item, index) => uniqueName(screaming, item.name, `value ${index + 1}`, taken));
}

// Constructor parameters of a class: inherited ones first, then its own, with
// optional parameters last so the signature is legal.
function constructorFields(type) {
  const parent = type.extends.find(isClass);
  const inherited = parent ? constructorFields(parent).map((entry) => ({ ...entry, own: false })) : [];
  const own = type.fields.filter((item) => !item.static && !inherited.some((entry) => entry.item.name === item.name)).map((item) => ({ item, own: true }));
  const all = [...inherited, ...own];
  return [...all.filter((entry) => !entry.item.nullable), ...all.filter((entry) => entry.item.nullable)];
}

function typescript(model) {
  const types = classifierModel(model);
  const files = types.map((type) => {
    // A superclass is used as a value; everything else is a type-only import.
    const superclass = isClass(type) ? type.extends.find(isClass) : null;
    const contracts = isClass(type) ? [...type.extends.filter((parent) => parent !== superclass), ...type.implements] : [];
    const imports = referenced(type, types).map((name) => `import ${superclass?.name === name ? '' : 'type '}{ ${name} } from './${kebab(name)}';`);
    const lines = [header(model, '//'), ...imports, '', ...(type.doc ? [`/** ${type.doc} */`] : [])];
    const field = (item, modifiers = '') => `  ${modifiers}${item.name}${item.nullable ? '?' : ''}: ${typeName(item.type, 'ts', types)};`;
    const signature = (method) => `${method.name}(${parseParameters(method.parameters).map((parameter) => `${parameter.name}: ${typeName(parameter.type, 'ts', types)}`).join(', ')}): ${typeName(method.returns || 'void', 'ts', types)}`;
    if (type.kind === 'enum') {
      lines.push(`export enum ${type.name} {`, ...literals(type).map((name) => `  ${name} = '${name}',`), '}');
    } else if (!isClass(type)) {
      const parents = [...type.extends, ...type.implements].map((parent) => parent.name);
      lines.push(`export interface ${type.name}${parents.length ? ` extends ${parents.join(', ')}` : ''} {`);
      lines.push(...type.fields.map((item) => field(item, type.kind === 'record' ? 'readonly ' : '')));
      lines.push(...type.methods.map((method) => `  ${signature(method)};`), '}');
    } else {
      const visibility = (item) => ({ private: 'private ', protected: 'protected ' }[item.visibility] || '');
      lines.push(`export ${type.kind === 'abstract' ? 'abstract ' : ''}class ${type.name}${superclass ? ` extends ${superclass.name}` : ''}${contracts.length ? ` implements ${contracts.map((parent) => parent.name).join(', ')}` : ''} {`);
      lines.push(...type.fields.filter((item) => item.static).map((item) => `  ${visibility(item)}static ${item.name}: ${typeName(item.type, 'ts', types)};`));
      const parameters = constructorFields(type);
      if (parameters.some((entry) => entry.own)) {
        const call = superclass ? ` super(${constructorFields(superclass).map((entry) => entry.item.name).join(', ')}); ` : '';
        lines.push('  constructor(', ...parameters.map(({ item, own }) => `    ${own ? visibility(item) || 'public ' : ''}${item.name}${item.nullable ? '?' : ''}: ${typeName(item.type, 'ts', types)},`), `  ) {${call}}`);
      }
      for (const method of type.methods) {
        if (method.abstract && type.kind === 'abstract') lines.push('', `  ${visibility(method)}abstract ${signature(method)};`);
        else lines.push('', `  ${visibility(method)}${method.static ? 'static ' : ''}${signature(method)} {`, `    throw new Error('Not implemented: ${type.name}.${method.name}');`, '  }');
      }
      lines.push('}');
    }
    return { path: `typescript/${kebab(type.name)}.ts`, content: `${lines.join('\n')}\n` };
  });
  if (files.length) files.push({ path: 'typescript/index.ts', content: `${header(model, '//')}\n${types.map((type) => `export * from './${kebab(type.name)}';`).join('\n')}\n` });
  return files;
}

// ---- Java -----------------------------------------------------------------

function java(model) {
  const types = classifierModel(model);
  const pkg = model.meta?.codegen?.package || 'com.example.domain';
  const dir = `java/${pkg.replace(/\./g, '/')}`;
  return types.map((type) => {
    const lines = [header(model, '//'), `package ${pkg};`, '', ...(type.doc ? [`/** ${type.doc} */`] : [])];
    const visibility = (item) => `${{ private: 'private', protected: 'protected', package: '' }[item.visibility] ?? 'public'} `.replace(/^ $/, '');
    const signature = (method) => `${typeName(method.returns || 'void', 'java', types)} ${method.name}(${parseParameters(method.parameters).map((parameter) => `${typeName(parameter.type, 'java', types)} ${parameter.name}`).join(', ')})`;
    if (type.kind === 'enum') lines.push(`public enum ${type.name} {`, `    ${literals(type).join(',\n    ')}`, '}');
    else if (type.kind === 'interface') {
      lines.push(`public interface ${type.name}${[...type.extends, ...type.implements].length ? ` extends ${[...type.extends, ...type.implements].map((parent) => parent.name).join(', ')}` : ''} {`);
      lines.push(...type.methods.map((method) => `    ${signature(method)};`), '}');
    } else if (type.kind === 'record') {
      lines.push(`public record ${type.name}(${type.fields.map((item) => `${typeName(item.type, 'java', types)} ${item.name}`).join(', ')})${type.implements.length ? ` implements ${type.implements.map((parent) => parent.name).join(', ')}` : ''} {`, '}');
    } else {
      lines.push(`public ${type.kind === 'abstract' ? 'abstract ' : ''}class ${type.name}${type.extends.length ? ` extends ${type.extends[0].name}` : ''}${type.implements.length ? ` implements ${type.implements.map((parent) => parent.name).join(', ')}` : ''} {`);
      for (const item of type.fields) lines.push(`    ${item.source === 'attribute' ? visibility(item).replace('public ', 'private ') : 'private '}${item.static ? 'static ' : ''}${typeName(item.type, 'java', types)} ${item.name};`);
      for (const item of type.fields.filter((entry) => !entry.static && entry.visibility !== 'private')) {
        const javaType = typeName(item.type, 'java', types); const cap = pascal(item.name);
        lines.push('', `    public ${javaType} get${cap}() {`, `        return ${item.name};`, '    }', '', `    public void set${cap}(${javaType} ${item.name}) {`, `        this.${item.name} = ${item.name};`, '    }');
      }
      for (const method of type.methods) {
        if (method.abstract && type.kind === 'abstract') lines.push('', `    ${visibility(method)}abstract ${signature(method)};`);
        else lines.push('', ...(type.implements.some((parent) => parent.methods.some((entry) => entry.name === method.name)) ? ['    @Override'] : []), `    ${visibility(method)}${method.static ? 'static ' : ''}${signature(method)} {`, `        throw new UnsupportedOperationException("Not implemented: ${type.name}.${method.name}");`, '    }');
      }
      lines.push('}');
    }
    return { path: `${dir}/${type.name}.java`, content: `${lines.join('\n')}\n` };
  });
}

// ---- Python ---------------------------------------------------------------

function python(model) {
  const types = classifierModel(model);
  if (!types.length) return [];
  // Emit supertypes and referenced types first so annotations resolve.
  const ordered = []; const seen = new Set();
  const visit = (type) => { if (seen.has(type)) return; seen.add(type); [...type.extends, ...type.implements].forEach(visit); ordered.push(type); };
  types.filter((type) => type.kind === 'enum').forEach(visit); types.forEach(visit);
  const lines = [header(model, '#'), 'from __future__ import annotations', '', 'from abc import ABC, abstractmethod', 'from dataclasses import dataclass, field', 'from datetime import date, datetime', 'from decimal import Decimal', 'from enum import Enum', 'from typing import Any, Protocol', 'from uuid import UUID', ''];
  for (const type of ordered) {
    lines.push('');
    const signature = (method) => `def ${snake(method.name)}(self${parseParameters(method.parameters).map((parameter) => `, ${snake(parameter.name)}: ${typeName(parameter.type, 'py', types)}`).join('')}) -> ${typeName(method.returns || 'void', 'py', types)}:`;
    const doc = type.doc ? [`    """${type.doc}"""`] : [];
    if (type.kind === 'enum') lines.push(`class ${type.name}(Enum):`, ...doc, ...literals(type).map((name) => `    ${name} = "${name}"`));
    else if (type.kind === 'interface') {
      lines.push(`class ${type.name}(Protocol):`, ...doc);
      if (!type.methods.length && !doc.length) lines.push('    ...');
      for (const method of type.methods) lines.push(`    ${signature(method)}`, '        ...', '');
      if (type.methods.length) lines.pop();
    } else {
      const bases = [...type.extends.map((parent) => parent.name), ...(type.kind === 'abstract' ? ['ABC'] : [])];
      // A subclass may add required fields after an inherited default, which
      // positional dataclass fields forbid; keyword-only fields allow it.
      const options = [...(type.kind === 'record' ? ['frozen=True'] : []), ...(type.extends.length ? ['kw_only=True'] : [])];
      lines.push(`@dataclass${options.length ? `(${options.join(', ')})` : ''}`, `class ${type.name}${bases.length ? `(${bases.join(', ')})` : ''}:`, ...doc);
      const fields = [...type.fields].sort((p, q) => Number(Boolean(p.nullable || parseType(p.type).many)) - Number(Boolean(q.nullable || parseType(q.type).many)));
      for (const item of fields) {
        const annotation = typeName(item.type, 'py', types);
        const suffix = parseType(item.type).many ? ' = field(default_factory=list)' : item.nullable ? ' | None = None' : '';
        lines.push(`    ${snake(item.name)}: ${annotation}${suffix}`);
      }
      if (!fields.length && !type.methods.length && !doc.length) lines.push('    pass');
      for (const method of type.methods) {
        lines.push('', ...(method.abstract && type.kind === 'abstract' ? ['    @abstractmethod'] : []), `    ${signature(method)}`, `        raise NotImplementedError("${type.name}.${snake(method.name)}")`);
      }
    }
    lines.push('');
  }
  return [{ path: `python/${snake(model.meta?.codegen?.namespace || 'domain')}.py`, content: `${lines.join('\n').replace(/\n{4,}/g, '\n\n\n').trimEnd()}\n` }];
}

// ---- SQL ------------------------------------------------------------------

function sql(model) {
  const types = classifierModel(model);
  const entities = types.filter((type) => type.kind === 'entity');
  if (!entities.length) return [];
  const enums = types.filter((type) => type.kind === 'enum');
  const lines = [header(model, '--'), '-- Dialect: PostgreSQL.', ''];
  const q = (name) => `"${name}"`;
  const foreign = new Map(entities.map((entity) => [entity.id, []]));
  for (const rel of model.relationships || []) {
    const from = entities.find((entity) => entity.id === rel.from); const to = entities.find((entity) => entity.id === rel.to);
    if (!from || !to || !['composition', 'aggregation', 'association'].includes(rel.kind)) continue;
    // The key lives on the "many" end; a to-one association keeps it on the source.
    const [holder, target] = many(rel.toMult) || rel.kind === 'composition' ? [to, from] : [from, to];
    // A to-one key takes the role name; repeated keys to one table stay distinct.
    const keys = foreign.get(holder.id);
    const stem = holder === from && rel.role ? snake(rel.role) : snake(target.name);
    let column = `${stem}_id`;
    if (keys.some((key) => key.column === column) && rel.role && holder !== from) column = `${stem}_${snake(rel.role)}_id`;
    for (let index = 2; keys.some((key) => key.column === column); index += 1) column = `${stem}_${index}_id`;
    keys.push({ column, target, required: rel.kind === 'composition' || !/^0/.test(String(holder === to ? rel.fromMult : rel.toMult) || ''), cascade: rel.kind === 'composition' });
  }
  for (const type of enums) {
    if (entities.some((entity) => entity.fields.some((item) => parseType(item.type).base === type.name))) {
      lines.push(`CREATE TYPE ${q(snake(type.name))} AS ENUM (${literals(type).map((name) => `'${name}'`).join(', ')});`, '');
    }
  }
  const constraints = [];
  for (const entity of entities) {
    const table = snake(entity.name);
    const columns = [];
    const fields = entity.fields.filter((item) => item.source === 'attribute');
    if (!fields.some((item) => item.pk)) columns.push('  "id" UUID PRIMARY KEY');
    for (const item of fields) {
      const { base } = parseType(item.type);
      const enumType = enums.find((type) => type.name === base);
      const sqlType = enumType ? q(snake(enumType.name)) : PRIMITIVES[base.toLowerCase()]?.sql || 'TEXT';
      columns.push(`  ${q(snake(item.name))} ${sqlType}${item.pk ? ' PRIMARY KEY' : item.nullable ? '' : ' NOT NULL'}${item.unique ? ' UNIQUE' : ''}`);
    }
    for (const key of foreign.get(entity.id)) {
      // The key column has the type of the primary key it references.
      const targetPk = key.target.fields.find((item) => item.source === 'attribute' && item.pk);
      const keyType = targetPk ? PRIMITIVES[parseType(targetPk.type).base.toLowerCase()]?.sql || 'TEXT' : 'UUID';
      if (!fields.some((item) => snake(item.name) === key.column)) columns.push(`  ${q(key.column)} ${keyType}${key.required ? ' NOT NULL' : ''}`);
      const targetKey = targetPk?.name || 'id';
      constraints.push(`ALTER TABLE ${q(table)} ADD CONSTRAINT ${q(`fk_${table}_${key.column}`)} FOREIGN KEY (${q(key.column)}) REFERENCES ${q(snake(key.target.name))} (${q(snake(targetKey))})${key.cascade ? ' ON DELETE CASCADE' : ''};`);
      constraints.push(`CREATE INDEX ${q(`idx_${table}_${key.column}`)} ON ${q(table)} (${q(key.column)});`);
    }
    lines.push(...(entity.doc ? [`-- ${entity.doc}`] : []), `CREATE TABLE ${q(table)} (`, columns.join(',\n'), ');', '');
  }
  lines.push(...constraints);
  return [{ path: 'sql/schema.sql', content: `${lines.join('\n').trimEnd()}\n` }];
}

// ---- OpenAPI --------------------------------------------------------------

function yaml(value, indent = 0) {
  const pad = '  '.repeat(indent);
  const scalar = (item) => (typeof item === 'string' ? (/^[A-Za-z][A-Za-z0-9 _./-]*$/.test(item) && !/^(true|false|null|yes|no|on|off)$/i.test(item) ? item : JSON.stringify(item)) : String(item));
  if (Array.isArray(value)) return value.length ? value.map((item) => (item && typeof item === 'object' ? `${pad}-\n${yaml(item, indent + 1)}` : `${pad}- ${scalar(item)}`)).join('\n') : `${pad}[]`;
  return Object.entries(value).map(([key, item]) => {
    const name = /^[A-Za-z_][A-Za-z0-9_-]*$/.test(key) ? key : JSON.stringify(key);
    if (item && typeof item === 'object') return Object.keys(item).length ? `${pad}${name}:\n${yaml(item, indent + 1)}` : `${pad}${name}: ${Array.isArray(item) ? '[]' : '{}'}`;
    return `${pad}${name}: ${scalar(item)}`;
  }).join('\n');
}

function openapi(model) {
  const interfaces = (model.elements || []).filter((element) => Array.isArray(element.operations) && element.operations.length);
  if (!interfaces.length) return [];
  const filePaths = new Set();
  const types = classifierModel(model);
  const schemaRef = (name) => (types.some((type) => type.name === name) ? { $ref: `#/components/schemas/${name}` } : { type: 'object' });
  const property = (item) => {
    const { base, many: isMany } = parseType(item.type);
    const primitive = PRIMITIVES[base.toLowerCase()];
    const schema = types.some((type) => type.name === base) ? { $ref: `#/components/schemas/${base}` } : primitive ? { ...primitive.oas } : { type: 'string' };
    return isMany ? { type: 'array', items: schema } : schema;
  };
  const schemas = {};
  for (const type of types) {
    if (type.kind === 'enum') schemas[type.name] = { type: 'string', enum: literals(type) };
    else if (['entity', 'record'].includes(type.kind)) {
      const required = type.fields.filter((item) => !item.nullable && !parseType(item.type).many).map((item) => item.name);
      schemas[type.name] = { type: 'object', ...(required.length ? { required } : {}), properties: Object.fromEntries(type.fields.map((item) => [item.name, property(item)])) };
    }
  }
  return interfaces.map((element) => {
    const paths = {};
    for (const operation of element.operations) {
      const method = String(operation.method || 'get').toLowerCase();
      const parameters = [...String(operation.path).matchAll(/\{([^}]+)\}/g)].map((match) => ({ name: match[1], in: 'path', required: true, schema: { type: 'string' } }));
      paths[operation.path] = { ...(paths[operation.path] || {}), [method]: {
        operationId: camel(`${method} ${String(operation.path).replace(/[{}]/g, '')}`),
        summary: operation.summary || `${method.toUpperCase()} ${operation.path}`,
        ...(parameters.length ? { parameters } : {}),
        ...(operation.request ? { requestBody: { required: true, content: { 'application/json': { schema: schemaRef(operation.request) } } } } : {}),
        responses: { [method === 'post' ? '201' : '200']: { description: 'Success', ...(operation.response ? { content: { 'application/json': { schema: schemaRef(operation.response) } } } : {}) } },
      } };
    }
    const doc = { openapi: '3.1.0', info: { title: element.label, version: '0.1.0', description: element.doc || `Generated from the ${model.meta?.title || 'enterprise'} model.` }, paths, components: { schemas } };
    return { path: `openapi/${uniqueName(kebab, element.label, element.id, filePaths)}.yaml`, content: `${header(model, '#')}\n${yaml(doc)}\n` };
  });
}

// ---- State machines -------------------------------------------------------

function statemachine(model) {
  const { elements } = indexModel(model);
  const machines = new Set(); const paths = new Set();
  return (model.views || []).filter((view) => view.type === 'state').map((view) => {
    const name = uniqueName(pascal, view.title, view.id, machines);
    const rels = viewRelationships(model, view).filter((rel) => rel.kind === 'transition');
    const states = (view.nodes || []).map((node) => elements.get(node.ref)).filter((element) => element && element.kind === 'state');
    const stateIds = new Set(states.map((state) => state.id));
    const stateNames = new Set();
    const keys = new Map(states.map((state) => [state.id, uniqueName(screaming, state.label, state.id, stateNames)]));
    const key = (element) => keys.get(element.id);
    const initial = rels.find((rel) => elements.get(rel.from)?.kind === 'initial' && stateIds.has(rel.to));
    const finals = rels.filter((rel) => elements.get(rel.to)?.kind === 'final' && stateIds.has(rel.from)).map((rel) => key(elements.get(rel.from)));
    const table = new Map(states.map((state) => [key(state), []]));
    for (const rel of rels) {
      if (!stateIds.has(rel.from) || !stateIds.has(rel.to)) continue;
      table.get(key(elements.get(rel.from))).push({ event: screaming(rel.label || `to ${key(elements.get(rel.to))}`), to: key(elements.get(rel.to)), guard: rel.guard });
    }
    // One state may leave on the same event under different guards. An object
    // key can hold one target, so those events are named by their target too.
    for (const entries of table.values()) {
      const seen = new Set();
      for (const entry of entries) {
        const repeated = entries.filter((other) => other.event === entry.event).length > 1;
        let event = repeated ? `${entry.event}_TO_${entry.to}` : entry.event;
        for (let index = 2; seen.has(event); index += 1) event = `${entry.event}_TO_${entry.to}_${index}`;
        seen.add(event);
        entry.key = event;
      }
    }
    for (const entries of table.values()) for (const entry of entries) entry.event = entry.key;
    const events = [...new Set([...table.values()].flat().map((entry) => entry.event))];
    const union = (items) => (items.length ? items.map((item) => `'${item}'`).join(' | ') : 'never');
    const lines = [header(model, '//'), '', `export type ${name}State = ${union([...table.keys()])};`, `export type ${name}Event = ${union(events)};`, '',
      `export const ${camel(name)}Initial: ${name}State = '${initial ? key(elements.get(initial.to)) : [...table.keys()][0]}';`,
      `export const ${camel(name)}Final: readonly ${name}State[] = [${[...new Set(finals)].map((item) => `'${item}'`).join(', ')}];`, '',
      `export const ${camel(name)}Transitions: Record<${name}State, Partial<Record<${name}Event, ${name}State>>> = {`,
      ...[...table.entries()].map(([state, entries]) => `  ${state}: {${entries.length ? ` ${entries.map((entry) => `${entry.event}: '${entry.to}'`).join(', ')} ` : ''}},${entries.some((entry) => entry.guard) ? ` // guards: ${entries.filter((entry) => entry.guard).map((entry) => `${entry.event} when ${String(entry.guard).replace(/[\r\n]+/g, ' ')}`).join('; ')}` : ''}`), '};', '',
      `export function ${camel(name)}Next(state: ${name}State, event: ${name}Event): ${name}State {`,
      `  const next = ${camel(name)}Transitions[state][event];`,
      '  if (!next) throw new Error(`Illegal transition: ${state} on ${event}`);', '  return next;', '}'];
    return { path: `statemachine/${uniqueName(kebab, view.title, view.id, paths)}.ts`, content: `${lines.join('\n')}\n` };
  });
}

// ---- BPMN 2.0 -------------------------------------------------------------

const BPMN_TAGS = {
  'start-event': 'startEvent', 'end-event': 'endEvent', 'intermediate-event': 'intermediateCatchEvent', subprocess: 'subProcess',
  'exclusive-gateway': 'exclusiveGateway', 'parallel-gateway': 'parallelGateway', 'inclusive-gateway': 'inclusiveGateway', 'data-store': 'dataStoreReference',
  initial: 'startEvent', final: 'endEvent', action: 'task', decision: 'exclusiveGateway', merge: 'exclusiveGateway', fork: 'parallelGateway', join: 'parallelGateway',
};
const BPMN_TASKS = { user: 'userTask', service: 'serviceTask', script: 'scriptTask', send: 'sendTask', receive: 'receiveTask', manual: 'manualTask' };
const BPMN_EVENT_DEFS = { message: 'messageEventDefinition', timer: 'timerEventDefinition', error: 'errorEventDefinition', signal: 'signalEventDefinition' };

function bpmn(model) {
  const { elements } = indexModel(model);
  const paths = new Set();
  return (model.views || []).filter((view) => view.type === 'bpmn' || view.type === 'activity').map((view) => {
    const layout = layoutView(model, view);
    const processId = `Process_${view.id}`;
    const flows = layout.edges.filter((edge) => ['sequence-flow', 'control-flow'].includes(edge.rel.kind));
    const lanes = (view.groups || []).filter((group) => group.kind === 'lane');
    const out = ['<?xml version="1.0" encoding="UTF-8"?>', `<!-- ${header(model, '').trim()} -->`,
      `<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" id="Definitions_${view.id}" targetNamespace="https://archify.dev/enterprise" exporter="Archify Enterprise">`];
    if (lanes.length) out.push(`  <bpmn:collaboration id="Collaboration_${view.id}">`, `    <bpmn:participant id="Participant_${view.id}" name="${xml(view.title)}" processRef="${processId}"/>`, '  </bpmn:collaboration>');
    out.push(`  <bpmn:process id="${processId}" name="${xml(view.title)}" isExecutable="false">`);
    if (lanes.length) {
      out.push(`    <bpmn:laneSet id="LaneSet_${view.id}">`);
      lanes.forEach((lane, index) => out.push(`      <bpmn:lane id="Lane_${view.id}_${index}" name="${xml(lane.label)}">`, ...lane.wraps.map((ref) => `        <bpmn:flowNodeRef>${ref}</bpmn:flowNodeRef>`), '      </bpmn:lane>'));
      out.push('    </bpmn:laneSet>');
    }
    for (const node of layout.nodes) {
      const element = elements.get(node.id);
      const tag = element.kind === 'task' ? BPMN_TASKS[element.taskType] || 'task' : BPMN_TAGS[element.kind] || 'task';
      const incoming = flows.filter((edge) => edge.to === node.id).map((edge) => `      <bpmn:incoming>${edge.id}</bpmn:incoming>`);
      const outgoing = flows.filter((edge) => edge.from === node.id).map((edge) => `      <bpmn:outgoing>${edge.id}</bpmn:outgoing>`);
      const definition = tag.endsWith('Event') && BPMN_EVENT_DEFS[element.trigger] ? [`      <bpmn:${BPMN_EVENT_DEFS[element.trigger]}/>`] : [];
      out.push(`    <bpmn:${tag} id="${node.id}"${element.label ? ` name="${xml(element.label)}"` : ''}>`, ...incoming, ...outgoing, ...definition, `    </bpmn:${tag}>`);
    }
    for (const edge of flows) {
      const name = edge.rel.label || (edge.rel.guard && edge.rel.guard !== 'else' ? edge.rel.guard : '');
      out.push(`    <bpmn:sequenceFlow id="${edge.id}" sourceRef="${edge.from}" targetRef="${edge.to}"${name ? ` name="${xml(name)}"` : ''}/>`);
    }
    out.push('  </bpmn:process>', `  <bpmndi:BPMNDiagram id="Diagram_${view.id}">`, `    <bpmndi:BPMNPlane id="Plane_${view.id}" bpmnElement="${lanes.length ? `Collaboration_${view.id}` : processId}">`);
    const bounds = (id, rect, extra = '') => out.push(`      <bpmndi:BPMNShape id="${id}_di" bpmnElement="${id}"${extra}>`, `        <dc:Bounds x="${Math.round(rect.x)}" y="${Math.round(rect.y)}" width="${Math.round(rect.w)}" height="${Math.round(rect.h)}"/>`, '      </bpmndi:BPMNShape>');
    if (lanes.length) {
      const frames = layout.groups.filter((group) => group.strip);
      const x0 = Math.min(...frames.map((frame) => frame.x)) - 30; const y0 = Math.min(...frames.map((frame) => frame.y));
      const x1 = Math.max(...frames.map((frame) => frame.x + frame.w)); const y1 = Math.max(...frames.map((frame) => frame.y + frame.h));
      bounds(`Participant_${view.id}`, { x: x0, y: y0, w: x1 - x0, h: y1 - y0 }, ' isHorizontal="true"');
      lanes.forEach((lane, index) => { const frame = frames.find((entry) => entry.label === lane.label); bounds(`Lane_${view.id}_${index}`, { x: x0 + 30, y: frame.y, w: x1 - x0 - 30, h: frame.h }, ' isHorizontal="true"'); });
    }
    for (const node of layout.nodes) bounds(node.id, node, KINDS[node.kind].shape === 'gateway' ? ' isMarkerVisible="true"' : '');
    for (const edge of flows) out.push(`      <bpmndi:BPMNEdge id="${edge.id}_di" bpmnElement="${edge.id}">`, ...edge.points.map(([x, y]) => `        <di:waypoint x="${Math.round(x)}" y="${Math.round(y)}"/>`), '      </bpmndi:BPMNEdge>');
    out.push('    </bpmndi:BPMNPlane>', '  </bpmndi:BPMNDiagram>', '</bpmn:definitions>');
    return { path: `bpmn/${uniqueName(kebab, view.title, view.id, paths)}.bpmn`, content: `${out.join('\n')}\n` };
  });
}

// ---- ArchiMate Model Exchange File Format ---------------------------------

const ARCHIMATE_RELATIONS = { composition: 'Composition', aggregation: 'Aggregation', assignment: 'Assignment', realization: 'Realization', serving: 'Serving', access: 'Access', influence: 'Influence', triggering: 'Triggering', flow: 'Flow', specialization: 'Specialization', association: 'Association' };
const archimateType = (kind) => ({ node: 'Node', device: 'Device', artifact: 'Artifact', contract: 'Contract', product: 'Product' }[kind] || pascal(kind));

function archimate(model) {
  const elements = (model.elements || []).filter((element) => KINDS[element.kind]?.family === 'archimate');
  if (!elements.length) return [];
  const ids = new Set(elements.map((element) => element.id));
  const relationships = (model.relationships || []).filter((rel) => ids.has(rel.from) && ids.has(rel.to) && ARCHIMATE_RELATIONS[rel.kind]);
  const relIds = new Set(relationships.map((rel) => rel.id));
  const out = ['<?xml version="1.0" encoding="UTF-8"?>', `<!-- ${header(model, '').trim()} -->`,
    '<model xmlns="http://www.opengroup.org/xsd/archimate/3.0/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://www.opengroup.org/xsd/archimate/3.0/ http://www.opengroup.org/xsd/archimate/3.1/archimate3_Diagram.xsd" identifier="id-model">',
    `  <name xml:lang="en">${xml(model.meta?.title)}</name>`, '  <elements>'];
  for (const element of elements) {
    out.push(`    <element identifier="id-${element.id}" xsi:type="${archimateType(element.kind)}">`, `      <name xml:lang="en">${xml(element.label)}</name>`, ...(element.doc ? [`      <documentation xml:lang="en">${xml(element.doc)}</documentation>`] : []), '    </element>');
  }
  out.push('  </elements>', '  <relationships>');
  for (const rel of relationships) {
    out.push(`    <relationship identifier="id-${rel.id}" source="id-${rel.from}" target="id-${rel.to}" xsi:type="${ARCHIMATE_RELATIONS[rel.kind]}">${rel.label ? `<name xml:lang="en">${xml(rel.label)}</name>` : ''}</relationship>`);
  }
  out.push('  </relationships>', '  <views>', '    <diagrams>');
  for (const view of (model.views || []).filter((entry) => entry.type === 'archimate')) {
    const layout = layoutView(model, view);
    out.push(`      <view identifier="id-${view.id}" xsi:type="Diagram">`, `        <name xml:lang="en">${xml(view.title)}</name>`);
    for (const node of layout.nodes.filter((entry) => ids.has(entry.id))) out.push(`        <node identifier="id-${view.id}-${node.id}" elementRef="id-${node.id}" xsi:type="Element" x="${Math.round(node.x)}" y="${Math.round(node.y)}" w="${Math.round(node.w)}" h="${Math.round(node.h)}"/>`);
    for (const edge of layout.edges.filter((entry) => relIds.has(entry.id))) out.push(`        <connection identifier="id-${view.id}-${edge.id}" relationshipRef="id-${edge.id}" xsi:type="Relationship" source="id-${view.id}-${edge.from}" target="id-${view.id}-${edge.to}"/>`);
    out.push('      </view>');
  }
  out.push('    </diagrams>', '  </views>', '</model>');
  return [{ path: `archimate/${kebab(model.meta?.title || 'model')}.archimate.xml`, content: `${out.join('\n')}\n` }];
}

const GENERATORS = { typescript, java, python, sql, openapi, statemachine, bpmn, archimate };

function generateCode(model, target) {
  if (!GENERATORS[target]) throw new Error(`Unknown code target "${target}". Use one of: ${Object.keys(GENERATORS).join(', ')}.`);
  return GENERATORS[target](model);
}

  artifact: t('D', 'release', 'Build and publish artifact:', 2, ['Pipeline builds a versioned, signed artifact']),
  'work-package': t('F', 'plan', 'Deliver work package:', 5, ['Scope, owner, and dates are agreed', 'All realised deliverables are accepted']),
  deliverable: t('F', 'release', 'Accept deliverable:', 2, ['Acceptance review is recorded']),
  plateau: t('F', 'milestone', 'Reach plateau:', 0, ['Everything realising this plateau is live']),
  gap: t('E', 'plan', 'Close gap:', 2, ['The gap is covered by an accepted work package']),
  component: t('C', 'build', 'Build component:', 5, ['Provided interfaces pass contract tests']),
  package: t('C', 'build', 'Set up package:', 1, ['Module boundary and ownership are defined']),
  usecase: t('C', 'build', 'Deliver use case:', 3, ['Main and alternate flows pass acceptance tests']),
  subprocess: t('B', 'design', 'Detail sub-process:', 3, ['The sub-process has its own agreed flow']),
};
const TASK_TYPES = {
  service: t('C', 'build', 'Automate step:', 3, ['The step runs without manual intervention', 'Failures are retried or escalated']),
  script: t('C', 'build', 'Script step:', 2, ['The script is versioned and tested']),
  send: t('C', 'build', 'Integrate outbound message:', 2, ['Message is delivered and logged']),
  receive: t('C', 'build', 'Integrate inbound message:', 2, ['Message is validated and acknowledged']),
  user: t('B', 'design', 'Design user task:', 2, ['Screen or form and work instruction are approved']),
  manual: t('B', 'design', 'Write work instruction:', 1, ['Instruction is published to the team doing the work']),
};

function templateFor(element) {
  if (element.kind === 'task') return TASK_TYPES[element.taskType] || TASK_TYPES.user;
  if (isClassifier(element.kind)) {
    const members = (element.attributes || []).length + (element.methods || []).length;
    if (element.kind === 'entity') return t('C', 'data', 'Create table and repository for', 2 + Math.ceil(members / 4), ['Migration applies and rolls back cleanly', 'Repository covers create, read, and update']);
    if (element.kind === 'enum') return t('C', 'build', 'Define enumeration', 1, ['Values match the model']);
    if (element.kind === 'interface') return t('C', 'specify', 'Define interface', 1 + Math.ceil(members / 4), ['Every operation is documented']);
    return t('C', 'build', `Implement ${element.kind === 'abstract' ? 'abstract class' : element.kind}`, 1 + Math.ceil(members / 3), ['Public methods are unit tested']);
  }
  return TEMPLATES[element.kind] || null;
}

// For a relationship from -> to, return [dependent, prerequisite] or null.
function ordering(rel, from, to) {
  const technology = layerOf(from) === 'technology';
  switch (rel.kind) {
    case 'serving': return [to, from];
    case 'access': case 'dependency': case 'include': case 'extend': case 'inheritance': case 'specialization': return [from, to];
    case 'triggering': case 'flow': return [to, from];
    case 'composition': case 'aggregation': return technology ? [to, from] : [from, to];
    case 'assignment': return [to, from];
    case 'realization':
      if (['requirement', 'outcome', 'goal', 'plateau', 'deliverable', 'constraint', 'principle'].includes(to.kind)) return [to, from];
      return [from, to];
    case 'association': return to.kind === 'gap' ? [to, from] : null;
    default: return null;
  }
}

function generateTasks(model) {
  const { elements } = indexModel(model);
  const drafts = [];
  const primary = new Map(); // element id -> draft that "delivers" the element
  const verify = new Map(); // requirement id -> governance draft
  const add = (draft) => { drafts.push(draft); return draft; };

  for (const element of model.elements || []) {
    const template = templateFor(element);
    if (!template) continue;
    const label = `${template.verb} ${element.label}`;
    const extra = element.kind === 'application-interface' && element.operations ? Math.ceil(element.operations.length / 2) : 0;
    const draft = add({ key: `el:${element.id}`, title: label.replace(/\s+/g, ' '), phase: template.phase, type: template.type, estimate: template.estimate + extra, acceptance: [...template.acceptance], element: element.id, deps: new Set() });
    if (element.doc) draft.description = element.doc;
    primary.set(element.id, draft);
    if (element.kind === 'requirement') {
      verify.set(element.id, add({ key: `verify:${element.id}`, title: `Verify requirement is met: ${element.label}`, phase: 'G', type: 'verify', estimate: 2, acceptance: ['Each acceptance criterion has passing evidence', 'Compliance review is recorded'], element: element.id, deps: new Set([draft.key]) }));
    }
  }

  // Behavioural views become one implementation task each.
  for (const view of model.views || []) {
    if (view.type !== 'state' && view.type !== 'activity') continue;
    const count = viewRelationships(model, view).length;
    add({ key: `view:${view.id}`, title: `Implement ${view.type === 'state' ? 'state machine' : 'workflow'}: ${view.title}`, phase: 'C', type: 'build', estimate: 2 + Math.ceil(count / 4), acceptance: [view.type === 'state' ? 'Every modelled transition is tested, and illegal transitions are rejected' : 'Every branch and parallel path is covered by a test'], view: view.id, deps: new Set() });
  }

  for (const rel of model.relationships || []) {
    const from = elements.get(rel.from); const to = elements.get(rel.to);
    if (!from || !to || from === to) continue;
    // Deploying an artifact is its own piece of work, after build and provisioning.
    const deploy = (rel.kind === 'deployment' && [from, to]) || (rel.kind === 'assignment' && to.kind === 'artifact' && layerOf(from) === 'technology' && [to, from]);
    if (deploy) {
      const [artifact, host] = deploy;
      if (primary.has(artifact.id) && primary.has(host.id)) {
        add({ key: `deploy:${rel.id}`, title: `Deploy ${artifact.label} to ${host.label}`, phase: 'G', type: 'release', estimate: 2, acceptance: ['Deployment is automated and repeatable', 'Health checks pass after rollout'], element: artifact.id, relationship: rel.id, deps: new Set([primary.get(artifact.id).key, primary.get(host.id).key]) });
      }
      continue;
    }
    // An artifact is built from the component it realises.
    const pair = rel.kind === 'realization' && (from.kind === 'artifact' || from.kind === 'deliverable') && !['plateau', 'deliverable'].includes(to.kind) ? [from, to] : ordering(rel, from, to);
    if (!pair) continue;
    const [dependent, prerequisite] = pair;
    const target = rel.kind === 'realization' && dependent.kind === 'requirement' ? verify.get(dependent.id) : primary.get(dependent.id);
    const source = primary.get(prerequisite.id);
    if (target && source && target !== source) target.deps.add(source.key);
  }

  // Order: break cycles deterministically, then level by longest path.
  const byKey = new Map(drafts.map((draft) => [draft.key, draft]));
  const dropped = [];
  const level = new Map();
  const remaining = new Set(drafts.map((draft) => draft.key));
  while (remaining.size) {
    const ready = [...remaining].filter((key) => [...byKey.get(key).deps].every((dep) => !remaining.has(dep)));
    if (!ready.length) {
      // Remove the dependency that points at the latest-phase prerequisite.
      const candidates = [...remaining].flatMap((key) => [...byKey.get(key).deps].filter((dep) => remaining.has(dep)).map((dep) => ({ key, dep })));
      const phaseIndex = (key) => ADM_PHASES.findIndex((phase) => phase.id === byKey.get(key).phase);
      candidates.sort((p, q) => (phaseIndex(q.dep) - phaseIndex(q.key)) - (phaseIndex(p.dep) - phaseIndex(p.key)) || p.key.localeCompare(q.key) || p.dep.localeCompare(q.dep));
      const cut = candidates[0];
      byKey.get(cut.key).deps.delete(cut.dep);
      dropped.push(cut);
      continue;
    }
    for (const key of ready) {
      level.set(key, Math.max(0, ...[...byKey.get(key).deps].map((dep) => level.get(dep) + 1)));
      remaining.delete(key);
    }
  }

  const phaseOrder = new Map(ADM_PHASES.map((phase, index) => [phase.id, index]));
  const ordered = drafts.map((draft, index) => ({ draft, index })).sort((p, q) => phaseOrder.get(p.draft.phase) - phaseOrder.get(q.draft.phase) || level.get(p.draft.key) - level.get(q.draft.key) || p.index - q.index);
  const ids = new Map(ordered.map(({ draft }, index) => [draft.key, `T-${String(index + 1).padStart(3, '0')}`]));
  const tasks = ordered.map(({ draft }) => {
    const element = draft.element ? elements.get(draft.element) : null;
    return {
      id: ids.get(draft.key), title: draft.title, phase: draft.phase, phaseLabel: ADM_PHASES.find((phase) => phase.id === draft.phase).label,
      type: draft.type, layer: element ? layerOf(element) : 'application', estimate: draft.estimate, wave: level.get(draft.key) + 1,
      dependsOn: [...draft.deps].map((key) => ids.get(key)).sort(),
      acceptance: draft.acceptance, ...(draft.description ? { description: draft.description } : {}),
      trace: { ...(element ? { element: element.id, kind: element.kind } : {}), ...(draft.view ? { view: draft.view } : {}), ...(draft.relationship ? { relationship: draft.relationship } : {}), views: element ? viewsOfElement(model, element.id).map((view) => view.id) : draft.view ? [draft.view] : [] },
    };
  });
  return {
    title: model.meta?.title || 'Enterprise model',
    phases: ADM_PHASES.map((phase) => ({ ...phase, tasks: tasks.filter((task) => task.phase === phase.id).map((task) => task.id) })).filter((phase) => phase.tasks.length),
    tasks,
    totals: { tasks: tasks.length, points: tasks.reduce((sum, task) => sum + task.estimate, 0), waves: Math.max(0, ...tasks.map((task) => task.wave)) },
    droppedDependencies: dropped.map((cut) => ({ task: ids.get(cut.key), dependsOn: ids.get(cut.dep), reason: 'dependency cycle' })),
  };
}

function tasksMarkdown(plan) {
  const lines = [`# Delivery plan: ${plan.title}`, '', `${plan.totals.tasks} tasks · ${plan.totals.points} points · ${plan.totals.waves} dependency waves. Generated by Archify Enterprise; phases follow the TOGAF ADM.`, ''];
  for (const phase of plan.phases) {
    lines.push(`## Phase ${phase.id}: ${phase.label}`, '');
    for (const task of plan.tasks.filter((entry) => entry.phase === phase.id)) {
      lines.push(`- [ ] **${task.id}** ${task.title} _(${task.type}, ${task.estimate} pt, wave ${task.wave})_`);
      if (task.dependsOn.length) lines.push(`  - Depends on: ${task.dependsOn.join(', ')}`);
      if (task.trace.element) lines.push(`  - Traces to: \`${task.trace.element}\` (${KINDS[task.trace.kind]?.label || task.trace.kind})`);
      for (const criterion of task.acceptance) lines.push(`  - Done when: ${criterion}`);
    }
    lines.push('');
  }
  if (plan.droppedDependencies.length) {
    lines.push('## Dependency cycles', '', 'These dependencies were removed so the plan can be ordered. Review the relationships that caused them.', '', ...plan.droppedDependencies.map((cut) => `- ${cut.task} no longer waits for ${cut.dependsOn}`), '');
  }
  return `${lines.join('\n').trimEnd()}\n`;
}

function tasksCsv(plan) {
  const cell = (value) => { const text = String(value ?? ''); return /[",\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text; };
  const rows = [['ID', 'Title', 'Phase', 'Phase name', 'Type', 'Layer', 'Estimate', 'Wave', 'Depends on', 'Element', 'Acceptance criteria']];
  for (const task of plan.tasks) rows.push([task.id, task.title, task.phase, task.phaseLabel, task.type, LAYERS[task.layer]?.label || task.layer, task.estimate, task.wave, task.dependsOn.join(' '), task.trace.element || task.trace.view || '', task.acceptance.join('; ')]);
  return `${rows.map((row) => row.map(cell).join(',')).join('\n')}\n`;
}

// A GOAL agent program whose goal base is the plan: one `done/1` goal per
// task, beliefs for what is finished, and rules that start any ready task.
function tasksGoal(plan) {
  const atom = (id) => `'${id}'`;
  const quote = (text) => `'${String(text).replace(/\\/g, '\\\\').replace(/'/g, "\\'")}'`;
  const knowledge = ['% Task knowledge generated by Archify Enterprise.', ':- dynamic done/1, started/1.', '',
    ...plan.tasks.map((task) => `task(${atom(task.id)}, ${quote(task.title)}, ${task.phase.toLowerCase()}, ${task.estimate}).`), '',
    ...plan.tasks.flatMap((task) => task.dependsOn.map((dep) => `requires(${atom(task.id)}, ${atom(dep)}).`)), '',
    'ready(T) :- task(T, _, _, _), not(done(T)), forall(requires(T, D), done(D)).', ''];
  const goals = ['% One achievement goal per task.', ...plan.tasks.map((task) => `done(${atom(task.id)}).`), ''];
  const moduleFile = ['use tasks as knowledge.', 'use progress as beliefs.', 'use targets as goals.', 'use delivery as actionspec.', '', 'exit = nogoals.', '',
    'module plan {', '\t% Start any task whose prerequisites are done, then finish what was started.', '\tif goal(done(T)), bel(ready(T), not(started(T))) then start(T).', '\tif bel(started(T), not(done(T))) then complete(T).', '}', ''];
  const actions = ['use tasks as knowledge.', '', 'define start(T) with', '\tpre { ready(T), not(started(T)) }', '\tpost { started(T) }', '', 'define complete(T) with', '\tpre { started(T), not(done(T)) }', '\tpost { done(T) }', ''];
  const mas = ['define planner as agent {', '\tuse plan as main module.', '}', '', 'launchpolicy {', '\tlaunch planner.', '}', ''];
  return [
    { path: 'goal/tasks.pl', content: knowledge.join('\n') },
    { path: 'goal/progress.pl', content: '% Beliefs: nothing is started or done yet.\n:- dynamic done/1, started/1.\n' },
    { path: 'goal/targets.pl', content: goals.join('\n') },
    { path: 'goal/plan.mod2g', content: moduleFile.join('\n') },
    { path: 'goal/delivery.act2g', content: actions.join('\n') },
    { path: 'goal/delivery.mas2g', content: mas.join('\n') },
  ];
}

function taskFiles(plan) {
  return [
    { path: 'tasks/plan.md', content: tasksMarkdown(plan) },
    { path: 'tasks/plan.csv', content: tasksCsv(plan) },
    { path: 'tasks/plan.json', content: `${JSON.stringify(plan, null, 2)}\n` },
    ...tasksGoal(plan),
  ];
}

// ---- lib/simulate.mjs ----
// Token-flow execution for activity, BPMN, and state views. The semantics are
// a small subset of fUML's offer-and-fire model: tokens sit on flows, a node
// fires when its inputs are offered, decisions route one token by guard, forks
// copy tokens, joins wait for every input, and a final node ends the run.


const FLOW_KINDS = new Set(['control-flow', 'object-flow', 'sequence-flow', 'transition']);
const EXCLUSIVE = new Set(['decision', 'choice', 'exclusive-gateway', 'state', 'initial']);
const WAIT_ALL = new Set(['join', 'parallel-gateway']);
const SOURCES = new Set(['initial', 'start-event']);

function evaluateGuard(guard, vars = {}) {
  const text = String(guard || '').trim();
  if (!text) return true;
  if (text === 'else') return null;
  const match = text.match(/^(!?)\s*([A-Za-z_][\w.]*)\s*(?:(==|!=|>=|<=|>|<)\s*(.+))?$/);
  if (!match) return undefined;
  const [, negate, name, operator, raw] = match;
  if (!(name in vars)) return undefined;
  const left = vars[name];
  if (!operator) return negate ? !left : Boolean(left);
  let right = raw.trim();
  if (/^-?\d+(\.\d+)?$/.test(right)) right = Number(right);
  else if (right === 'true' || right === 'false') right = right === 'true';
  else right = right in vars ? vars[right] : right.replace(/^['"]|['"]$/g, '');
  switch (operator) {
    case '==': return left === right;
    case '!=': return left !== right;
    case '>': return left > right;
    case '<': return left < right;
    case '>=': return left >= right;
    default: return left <= right;
  }
}

function createRun(model, viewId, vars) {
  const view = (model.views || []).find((entry) => entry.id === viewId);
  if (!view || !['activity', 'bpmn', 'state'].includes(view.type)) throw new Error(`View "${viewId}" is not executable; use an activity, bpmn, or state view.`);
  const { elements } = indexModel(model);
  const flows = viewRelationships(model, view).filter((rel) => FLOW_KINDS.has(rel.kind));
  const nodes = (view.nodes || []).map((node) => elements.get(node.ref)).filter(Boolean);
  const run = { view: view.id, type: view.type, vars: { ...(view.vars || {}), ...(vars || {}) }, nodes, flows, tokens: [], log: [], steps: 0, done: false };
  for (const node of nodes) {
    if (SOURCES.has(node.kind) && !flows.some((flow) => flow.to === node.id)) fire(run, node.id);
  }
  return run;
}

const incoming = (run, id) => run.flows.filter((flow) => flow.to === id);
const outgoing = (run, id) => run.flows.filter((flow) => flow.from === id);

// Nodes that can fire now, with the outgoing choices a caller may pick.
function enabled(run) {
  if (run.done) return [];
  const out = [];
  for (const node of run.nodes) {
    const inputs = incoming(run, node.id);
    if (!inputs.length) continue;
    const offered = inputs.filter((flow) => run.tokens.includes(flow.id));
    const ready = WAIT_ALL.has(node.kind) && inputs.length > 1 ? offered.length === inputs.length : offered.length > 0;
    if (!ready) continue;
    const exits = outgoing(run, node.id);
    const choices = EXCLUSIVE.has(node.kind) && exits.length > 1 ? enabledChoices(run, node, exits) : [];
    out.push({ node: node.id, choices });
  }
  return out;
}
const flowHasGuard = (flow) => Boolean(String(flow.guard || '').trim());

function fire(run, nodeId, choice) {
  const node = run.nodes.find((entry) => entry.id === nodeId);
  if (!node) throw new Error(`Node "${nodeId}" is not in view "${run.view}".`);
  const inputs = incoming(run, nodeId); const exits = outgoing(run, nodeId);
  if (inputs.length) {
    const offered = inputs.filter((flow) => run.tokens.includes(flow.id));
    const consume = WAIT_ALL.has(node.kind) && inputs.length > 1 ? offered : offered.slice(0, 1);
    if (!consume.length) throw new Error(`Node "${nodeId}" has no offered token.`);
    for (const flow of consume) run.tokens.splice(run.tokens.indexOf(flow.id), 1);
  }
  let produced = exits;
  if (EXCLUSIVE.has(node.kind) && exits.length > 1) {
    const options = enabledChoices(run, node, exits);
    const picked = choice && options.includes(choice) ? choice : options.length === 1 ? options[0] : null;
    if (!picked) {
      // Undo consumption so the caller can retry with a choice.
      for (const flow of inputs.slice(0, 1)) run.tokens.push(flow.id);
      throw new Error(`Node "${nodeId}" needs a choice between: ${options.join(', ')}.`);
    }
    produced = exits.filter((flow) => flow.id === picked);
  }
  run.steps += 1;
  if (node.kind === 'final' && run.type === 'activity') run.tokens = [];
  else for (const flow of produced) run.tokens.push(flow.id);
  run.log.push({ step: run.steps, node: nodeId, label: node.label || node.kind, took: produced.map((flow) => flow.id) });
  if (!run.tokens.length) run.done = true;
  return run;
}

function enabledChoices(run, node, exits) {
  const results = exits.map((flow) => ({ flow, result: evaluateGuard(flow.guard, run.vars) }));
  const passing = results.filter((entry) => entry.result === true && flowHasGuard(entry.flow));
  if (passing.length) return [passing[0].flow.id];
  const open = results.filter((entry) => entry.result !== false);
  const decided = open.filter((entry) => entry.result === null);
  const unknown = open.filter((entry) => entry.result !== null);
  return unknown.length ? open.map((entry) => entry.flow.id) : decided.map((entry) => entry.flow.id);
}

// Run until nothing can fire. `chooser` resolves ambiguous decisions; the
// default takes the first option so a run is always deterministic.
function runToCompletion(run, { maxSteps = 500, chooser = (options) => options[0] } = {}) {
  while (!run.done && run.steps < maxSteps) {
    const ready = enabled(run);
    if (!ready.length) break;
    const next = ready[0];
    fire(run, next.node, next.choices.length > 1 ? chooser(next.choices, next.node) : next.choices[0]);
  }
  return run;
}

// ---- lib/native.mjs ----
// Compile enterprise views down to Archify's native typed JSON so the
// existing renderers, validators, Viewer, and delivery receipts apply.
//
//   class                               -> diagram_type "class"
//   sequence                            -> diagram_type "sequence"
//   state                               -> diagram_type "lifecycle" (schema 3)
//   archimate / component / deployment  -> diagram_type "architecture" (grid)
//
// Views with no native counterpart (bpmn, activity, usecase) return null; the
// enterprise renderer remains their only output.


const NATIVE_TYPES = { class: 'class', sequence: 'sequence', state: 'lifecycle', archimate: 'architecture', component: 'architecture', deployment: 'architecture' };

const meta = (model, view, extra = {}) => ({ title: view.title, subtitle: [model.meta?.title, view.viewpoint || VIEW_TYPES[view.type].label].filter(Boolean).join(' · '), output: `${view.id}.html`, ...extra });
const LABEL_DROP = 78;
const CLASS_KINDS = { entity: 'record' };
const CLASS_RELATIONS = { specialization: 'inheritance' };
const pick = (source, keys) => Object.fromEntries(keys.filter((key) => source[key] !== undefined).map((key) => [key, source[key]]));

// The enterprise grid allows any fractional row or column. Native grids want
// integer cells (class columns also allow halves), so rank the distinct
// coordinates instead of rounding them, which could put two nodes in one cell.
function gridCells(nodes, { halfCols = false } = {}) {
  const rank = (values) => { const sorted = [...new Set(values)].sort((a, b) => a - b); return (value) => sorted.indexOf(value); };
  const row = rank(nodes.map((node) => node.row));
  const col = rank(nodes.map((node) => node.col));
  const taken = new Set();
  return new Map(nodes.map((node) => {
    const cell = { row: row(node.row), col: halfCols ? Math.round(node.col * 2) / 2 : col(node.col) };
    while (taken.has(`${cell.row}:${cell.col}`)) cell.col += halfCols ? 0.5 : 1;
    taken.add(`${cell.row}:${cell.col}`);
    return [node.ref, cell];
  }));
}

function classView(model, view, elements, notes) {
  const cells = gridCells(view.nodes || [], { halfCols: true });
  const types = (view.nodes || []).map((node) => {
    const element = elements.get(node.ref);
    return {
      id: element.id, label: element.label, kind: CLASS_KINDS[element.kind] || element.kind, ...(element.doc ? { sublabel: element.doc } : {}),
      ...cells.get(node.ref),
      ...(element.attributes?.length ? { attributes: element.attributes.map((item) => pick(item, ['name', 'type', 'visibility', 'static'])) } : {}),
      ...(element.methods?.length ? { methods: element.methods.map((item) => pick(item, ['name', 'parameters', 'returns', 'visibility', 'static', 'abstract'])) } : {}),
    };
  }).filter((type) => ['class', 'abstract', 'interface', 'enum', 'record'].includes(type.kind));
  const ids = new Set(types.map((type) => type.id));
  for (const rel of viewRelationships(model, view)) if (rel.from === rel.to) notes.push(`Self-relationship "${rel.id}" has no native class notation and was left out.`);
  const relationships = viewRelationships(model, view).filter((rel) => ids.has(rel.from) && ids.has(rel.to) && rel.from !== rel.to)
    .map((rel) => ({ id: rel.id, from: rel.from, to: rel.to, kind: CLASS_RELATIONS[rel.kind] || rel.kind, ...(rel.label ? { label: rel.label } : {}) }))
    .filter((rel) => ['dependency', 'association', 'inheritance', 'realization', 'composition', 'aggregation'].includes(rel.kind));
  return { schema_version: 1, diagram_type: 'class', meta: meta(model, view), layout: { mode: 'grid' }, types, relationships };
}

function sequenceView(model, view, elements, notes) {
  const participants = (view.participants || []).map((ref) => { const element = elements.get(ref); return { id: element.id, type: toneOf(element), label: element.label, sublabel: element.tech || kindSpec(element.kind).label }; });
  const VARIANTS = { sync: 'default', async: 'dashed', reply: 'return', self: 'default' };
  const step = 30;
  // The native renderer draws messages between two participants only, so an
  // internal step becomes a note on the nearest real message.
  const messages = []; const pending = [];
  for (const message of view.messages || []) {
    if (message.from === message.to) {
      const text = `${elements.get(message.from).label}: ${message.label || 'internal step'}`;
      if (messages.length) messages[messages.length - 1].note = [messages[messages.length - 1].note, text].filter(Boolean).join('; ');

function stateView(model, view, elements, notes) {
  const rels = viewRelationships(model, view).filter((rel) => rel.kind === 'transition');
  const placed = (view.nodes || []).map((node) => elements.get(node.ref));
  const real = placed.filter((element) => element.kind !== 'initial');
  const entry = new Set(rels.filter((rel) => elements.get(rel.from).kind === 'initial').map((rel) => rel.to));
  const outgoing = new Map(real.map((element) => [element.id, rels.filter((rel) => rel.from === element.id && elements.get(rel.to).kind !== 'initial')]));
  const typeOf = (element) => {
    if (element.kind === 'final') return 'success';
    if (entry.has(element.id)) return 'start';
    if (element.kind === 'choice') return 'decision';
    if (!outgoing.get(element.id).length) return 'neutral';
    return 'active';

  // The happy path is the longest simple path from the entry state.
  const start = real.find((element) => entry.has(element.id)) || real[0];
  let best = [];
  const walk = (id, trail) => {
    const next = outgoing.get(id).filter((rel) => !trail.includes(rel.to));
    if (trail.length > best.length) best = trail;
    for (const rel of next) walk(rel.to, [...trail, rel.to]);
  };
  walk(start.id, [start.id]);
  const states = real.map((element) => ({ id: element.id, type: typeOf(element), label: element.label || 'Done' }));
  const seen = new Set();
  for (const rel of rels) if (rel.from === rel.to) notes.push(`Self-transition "${rel.id}" has no native lifecycle notation and was left out.`);
  const transitions = rels.filter((rel) => elements.get(rel.from).kind !== 'initial' && rel.from !== rel.to)
    .filter((rel) => { const key = `${rel.from}>${rel.to}`; if (seen.has(key)) return false; seen.add(key); return true; })
    .map((rel) => ({ id: rel.id, from: rel.from, to: rel.to, ...(rel.label ? { label: rel.label } : {}) }));
  return { schema_version: 3, diagram_type: 'lifecycle', meta: meta(model, view), mainPath: best, states, transitions };
}

function architectureView(model, view, elements, notes) {
  const nodes = view.nodes || [];
  const cells = gridCells(nodes);
  // Native cards are fixed-size, so size every card for the longest label.
  const width = Math.max(150, ...nodes.map((node) => Math.ceil(elements.get(node.ref).label.length * 7.4) + 34));
  const components = nodes.map((node) => { const element = elements.get(node.ref); return { id: element.id, type: toneOf(element), label: element.label, sublabel: element.tech || kindSpec(element.kind).label, ...cells.get(node.ref), size: [width, 64] }; });
  const cell = new Map(components.map((component) => [component.id, component]));
  // A label on a vertical run is moved off the source card into the row gap.
  const labelShift = (rel) => { const from = cell.get(rel.from); const to = cell.get(rel.to); return from.col === to.col && from.row !== to.row ? { labelDy: Math.sign(to.row - from.row) * LABEL_DROP } : {}; };
  for (const rel of viewRelationships(model, view)) if (rel.from === rel.to) notes.push(`Self-relationship "${rel.id}" has no native architecture notation and was left out.`);
  const connections = viewRelationships(model, view).filter((rel) => rel.from !== rel.to).map((rel) => ({ id: rel.id, from: rel.from, to: rel.to, ...(rel.label ? { label: rel.label, ...labelShift(rel) } : {}), ...(RELATIONS[rel.kind].dash === 'solid' ? {} : { variant: 'dashed' }) }));
  const boundaries = (view.groups || []).map((group) => ({ kind: 'region', label: group.label, wraps: group.wraps }));
  const layout = { mode: 'grid', cols: Math.max(...components.map((component) => component.col)) + 1, cellW: width, cellH: 64, gapX: 150, gapY: 110 };
  return { schema_version: 1, diagram_type: 'architecture', meta: meta(model, view), layout, components, ...(boundaries.length ? { boundaries } : {}), connections };
}

function compileView(model, viewId) {
  const { elements, views } = indexModel(model);
  const view = views.get(viewId);
  if (!view) throw new Error(`Unknown view "${viewId}"`);
  const type = NATIVE_TYPES[view.type];
  if (!type) return null;
  const notes = [];
  const diagram = { class: classView, sequence: sequenceView, lifecycle: stateView, architecture: architectureView }[type](model, view, elements, notes);
  return { type, view: view.id, path: `archify/${view.id}.${type}.json`, diagram, notes };
}

function compileNative(model) {
  return (model.views || []).map((view) => compileView(model, view.id)).filter((entry) => entry?.diagram);
}

  for (const phase of plan.phases) {
    if (state.phase !== 'all' && state.phase !== phase.id) continue;
    add(panel, h('div', { class: 'phase' }, h('span', { class: 'label', text: `Phase ${phase.id}` }), h('b', { text: phase.label })));
    for (const task of plan.tasks.filter((entry) => entry.phase === phase.id)) {
      add(panel, h('button', { class: 'task', type: 'button', title: task.acceptance.join('\n'), onclick: () => { if (task.trace.element) focusElement(task.trace.element); else if (task.trace.view) selectView(task.trace.view); } },
        h('span', { class: 'head' }, h('span', { class: 'id', text: task.id }), h('span', { class: 'title', text: task.title })),
        h('span', { class: 'meta', text: `${task.type} · ${task.estimate} pt · wave ${task.wave}${task.dependsOn.length ? ` · after ${task.dependsOn.join(', ')}` : ''}` })));
    }
  }
}

function renderModel(panel) {
  const text = state.sourceDraft ?? JSON.stringify(state.model, null, 2);
  const area = h('textarea', { class: 'source', id: 'model-source', spellcheck: 'false', 'aria-label': 'Model JSON', oninput: (event) => { state.sourceDraft = event.target.value; } });
  area.value = text;
  const apply = () => {
    let parsed;
    try { parsed = JSON.parse($('model-source').value); } catch (error) { state.sourceError = [{ severity: 'error', message: `Not valid JSON: ${error.message}` }]; renderPanel(); return; }
    const result = validateModel(parsed);
    if (!result.ok) { state.sourceError = result.diagnostics.filter((entry) => entry.severity === 'error'); renderPanel(); return; }
    state.model = parsed; state.selected = null;
    if (!parsed.views.some((view) => view.id === state.viewId)) state.viewId = parsed.views[0]?.id || null;
    state.fitted = false;
    commit('Model applied');
  };
  const fileInput = h('input', { id: 'model-file', type: 'file', accept: '.json,application/json', class: 'sr', 'aria-label': 'Open model file', onchange: async (event) => { const file = event.target.files[0]; if (!file) return; state.sourceDraft = await file.text(); renderPanel(); toast('File loaded. Press Apply to use it.'); } });
  add(panel, h('p', { text: 'The model is typed JSON: elements, relationships, and views that place elements on a row/col grid. Edit it here, or hand the same file to the enterprise CLI.' }),
    h('div', { class: 'row' }, h('button', { class: 'btn small', type: 'button', onclick: apply }, 'Apply'),
      h('button', { class: 'btn small', type: 'button', onclick: () => copyText($('model-source').value, 'model JSON') }, 'Copy'),
      h('button', { class: 'btn small', type: 'button', onclick: () => fileInput.click() }, 'Open file…'), fileInput,
      state.sourceDraft !== null ? h('button', { class: 'btn small', type: 'button', onclick: () => commit('Edits discarded.') }, 'Discard edits') : null),
    (state.sourceError || []).slice(0, 6).map((entry) => h('div', { class: 'diag error', text: entry.message })), area);
}

function renderPanel() {
  const panel = $('panel'); const scroll = panel.scrollTop; panel.replaceChildren();
  ({ inspect: renderInspect, code: renderCode, tasks: renderTasks, model: renderModel })[state.tab](panel);
  panel.scrollTop = state.tab === 'inspect' ? 0 : scroll;
}

function renderAll() {
  $('model-title').textContent = state.model.meta?.title || '';
  $('theme-name').textContent = state.preset || document.documentElement.dataset.theme || 'auto';
  renderRail(); renderCanvas(); renderAddPopover(); renderTabs(); renderPanel();
}

// ---- Chrome -----------------------------------------------------------------
const THEME_CYCLE = ['auto', 'dark', 'light', 'blueprint'];
let themeChoice = 'auto'; const hostTheme = document.documentElement.dataset.theme;
$('theme-btn').addEventListener('click', () => {
  themeChoice = THEME_CYCLE[(THEME_CYCLE.indexOf(themeChoice) + 1) % THEME_CYCLE.length];
  const root = document.documentElement;
  state.preset = themeChoice === 'blueprint' ? 'blueprint' : null;
  if (state.preset) root.dataset.preset = 'blueprint'; else delete root.dataset.preset;
  if (themeChoice === 'dark' || themeChoice === 'light') root.dataset.theme = themeChoice;
  else if (themeChoice === 'blueprint') root.dataset.theme = 'dark';
  else if (hostTheme) root.dataset.theme = hostTheme; else delete root.dataset.theme;
  renderCanvas(); $('theme-name').textContent = themeChoice;
});
new MutationObserver(() => { if (themeChoice === 'auto') renderCanvas(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => renderCanvas());
$('export-svg').addEventListener('click', () => copyText(renderView(state.model, currentView().id, { theme: effectiveTheme() }).svg, 'SVG'));
$('reset-btn').addEventListener('click', () => { state.model = structuredClone(EXAMPLE); state.viewId = state.model.views[0].id; state.selected = null; state.fitted = false; commit('Example model loaded'); });
window.addEventListener('hashchange', () => { const next = initialView(); if (next && next !== state.viewId) selectView(next); });
window.addEventListener('resize', () => { if (rendered) { fit(); applyTransform(); } });

renderAll();
}
</script>
</body>
</html>
