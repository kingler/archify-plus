<title>Archify Enterprise Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: one technical canvas with a view rail on the left and one evidence panel on the right (DESIGN.md, "The Evidence Console"). */
:root {
  --bg: #020617; --mask: #0f172a; --text: #ffffff; --text-muted: #94a3b8; --text-dim: #64748b; --border: #1e293b;
  --control: rgba(15, 23, 42, 0.8); --control-border: #334155; --control-text: #e2e8f0; --accent: #22d3ee; --good: #34d399; --warn: #fbbf24; --bad: #fb7185;
  --frontend: #22d3ee; --backend: #34d399; --database: #a78bfa; --cloud: #fbbf24; --security: #fb7185; --messagebus: #fb923c; --external: #94a3b8;

  --control: rgba(255, 255, 255, 0.92); --control-border: #cbd5e1; --control-text: #334155; --accent: #0891b2; --good: #059669; --warn: #b45309; --bad: #e11d48;
  --frontend: #0891b2; --backend: #059669; --database: #7c3aed; --cloud: #d97706; --security: #e11d48; --messagebus: #ea580c; --external: #64748b;
  color-scheme: light;
} }
:root[data-theme="light"] {
  --bg: #f4f5f7; --mask: #ffffff; --text: #111827; --text-muted: #5b6474; --text-dim: #7b8494; --border: #e5e7eb;
  --control: rgba(255, 255, 255, 0.92); --control-border: #cbd5e1; --control-text: #334155; --accent: #0891b2; --good: #059669; --warn: #b45309; --bad: #e11d48;
  --frontend: #0891b2; --backend: #059669; --database: #7c3aed; --cloud: #d97706; --security: #e11d48; --messagebus: #ea580c; --external: #64748b;
  color-scheme: light;
}
:root[data-preset="blueprint"] {
  --bg: #030711; --mask: #07101e; --text: #f5fbff; --text-muted: #9eb0c7; --text-dim: #6a7f9a; --border: #1d3350;
  --control: rgba(6, 14, 28, 0.78); --control-border: #2c4564; --control-text: #dbe7f5; --accent: #67e8f9; --good: #5eead4; --warn: #fcd34d; --bad: #fda4af;
  --frontend: #67e8f9; --backend: #5eead4; --database: #c4b5fd; --cloud: #fcd34d; --security: #fda4af; --messagebus: #fdba74; --external: #9eb0c7;

html, body { height: 100%; }

*, *::before, *::after { box-sizing: border-box; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; gap: 12px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; margin-right: auto; }
.brand h1 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; }
.brand span { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.btn.small { min-height: 26px; padding: 0 8px; font-size: 11px; }
.btn.danger:hover { border-color: var(--bad); color: var(--bad); }
.btn:disabled { opacity: .45; cursor: default; }
.work { display: grid; grid-template-columns: 232px minmax(0, 1fr) 388px; gap: 12px; min-height: 0; }
.pane { min-height: 0; min-width: 0; border: 1px solid var(--border); border-radius: var(--r-panel); background: color-mix(in srgb, var(--mask) 50%, transparent); overflow: hidden; display: flex; flex-direction: column; }
.label { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); }
.rail { overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 14px; }
.rail section { display: flex; flex-direction: column; gap: 4px; }
.view-link { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border: 1px solid transparent; border-radius: var(--r-control); background: none; text-align: left; cursor: pointer; color: var(--control-text); }
.view-link:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.view-link[aria-current="true"] { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--text); }
.view-link small { margin-left: auto; color: var(--text-dim); font-size: 10px; }
.dot { flex: none; width: 8px; height: 8px; border-radius: 2px; background: var(--tone, var(--external)); }
.search { width: 100%; min-height: 32px; padding: 0 10px; border: 1px solid var(--control-border); border-radius: var(--r-control); background: var(--mask); }
.stage { position: relative; }
.canvas { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; background: var(--bg); background-image: radial-gradient(color-mix(in srgb, var(--text-muted) 16%, transparent) 1px, transparent 1px); background-size: 22px 22px; }
.canvas.is-panning { cursor: grabbing; }
.canvas-inner { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.canvas-inner svg { display: block; background: transparent !important; }
.canvas-inner svg .ea-canvas { fill: transparent; }
.floating { position: absolute; display: flex; flex-wrap: wrap; gap: 6px; z-index: 2; }
.floating.tl { left: 10px; top: 10px; right: 10px; }
.floating.br { right: 10px; bottom: 10px; }
.sim-status { display: inline-flex; align-items: center; min-height: 26px; padding: 0 8px; border-radius: var(--r-control); background: var(--control); border: 1px solid var(--control-border); color: var(--text-muted); font-size: 11px; }
.popover { position: absolute; left: 10px; top: 46px; z-index: 3; width: min(300px, calc(100% - 20px)); padding: 12px; border: 1px solid var(--control-border); border-radius: var(--r-control); background: var(--mask); box-shadow: 0 18px 48px rgba(0, 0, 0, .3); display: flex; flex-direction: column; gap: 8px; }
.tabs { display: flex; border-bottom: 1px solid var(--border); }
.tab { flex: 1; min-height: 38px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--text-muted); cursor: pointer; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.panel { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
.panel p { margin: 0; color: var(--text-muted); overflow-wrap: anywhere; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field input, .field select, .field textarea, .popover input, .popover select { width: 100%; min-height: 32px; padding: 6px 8px; border: 1px solid var(--control-border); border-radius: var(--r-control); background: var(--mask); }
.field textarea { min-height: 64px; resize: vertical; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row > .grow { flex: 1; min-width: 120px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 0 8px; border: 1px solid var(--control-border); border-radius: 999px; background: none; color: var(--control-text); font-size: 11px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.chip.static { cursor: default; }
.list { display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; list-style: none; }
.link { display: block; width: 100%; padding: 5px 8px; border: 1px solid var(--border); border-radius: var(--r-control); background: none; text-align: left; cursor: pointer; color: var(--control-text); overflow-wrap: anywhere; }
.link:hover { border-color: var(--accent); }
.link b { font-weight: 600; color: var(--text); }
.link em { font-style: normal; color: var(--text-muted); }
pre.code { margin: 0; padding: 12px; border: 1px solid var(--border); border-radius: var(--r-control); background: var(--mask); overflow: auto; font-size: 11px; line-height: 1.5; white-space: pre; tab-size: 2; flex: 1; min-height: 160px; }
textarea.source { flex: 1; min-height: 240px; width: 100%; padding: 12px; border: 1px solid var(--control-border); border-radius: var(--r-control); background: var(--mask); font-size: 11px; line-height: 1.5; white-space: pre; resize: none; }
.diag { padding: 6px 8px; border-left: 2px solid var(--warn); background: color-mix(in srgb, var(--warn) 8%, transparent); border-radius: 0 var(--r-precise) var(--r-precise) 0; overflow-wrap: anywhere; }
.diag.error { border-left-color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, transparent); }
.diag.ok { border-left-color: var(--good); background: color-mix(in srgb, var(--good) 8%, transparent); }
.task { display: flex; flex-direction: column; gap: 4px; width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--r-control); background: none; text-align: left; cursor: pointer; }
.task:hover { border-color: var(--accent); }
.task .head { display: flex; gap: 8px; align-items: baseline; }
.task .id { color: var(--accent); font-weight: 700; font-size: 11px; flex: none; }
.task .title { color: var(--text); overflow-wrap: anywhere; }
.task .meta { color: var(--text-muted); font-size: 11px; }
.phase { display: flex; align-items: baseline; gap: 8px; margin-top: 4px; }
.phase b { font-size: 12px; font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--r-control); }
.stat b { display: block; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.legend-svg { width: 100%; height: auto; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 8px 14px; border: 1px solid var(--control-border); border-radius: var(--r-control); background: var(--mask); z-index: 20; box-shadow: 0 18px 48px rgba(0, 0, 0, .3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (max-width: 1100px) { .work { grid-template-columns: 200px minmax(0, 1fr) 320px; } }
@media (max-width: 860px) {
  html, body { height: auto; }
  .app { height: auto; }
  .work { grid-template-columns: minmax(0, 1fr); }
  .rail { flex-direction: row; overflow-x: auto; overflow-y: hidden; gap: 16px; }
  .rail section { flex-direction: row; align-items: center; flex: none; }
  .rail .elements { display: none; }
  .view-link { width: auto; white-space: nowrap; }
  .stage { height: 62vh; min-height: 320px; }
  .side { min-height: 420px; max-height: 80vh; }
  .btn, .tab { min-height: 2.75rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app" id="app">
  <header class="bar">
    <div class="brand"><h1>Archify Enterprise Studio</h1><span id="model-title"></span></div>
    <button class="btn" id="theme-btn" type="button" title="Switch theme">Theme: <span id="theme-name">auto</span></button>
    <button class="btn" id="export-svg" type="button" title="Copy this view as SVG">Copy SVG</button>
    <button class="btn" id="reset-btn" type="button" title="Load the bundled example model">Load example</button>
  </header>
  <main class="work">
    <nav class="pane rail" id="rail" aria-label="Views and elements"></nav>
    <section class="pane stage" aria-label="Diagram">
      <div class="floating tl" id="canvas-tools"></div>
      <div class="popover" id="add-popover" hidden></div>
      <div class="canvas" id="canvas"><div class="canvas-inner" id="canvas-inner"></div></div>
      <div class="floating br">
        <button class="btn small" id="zoom-out" type="button" aria-label="Zoom out">−</button>
        <button class="btn small" id="zoom-fit" type="button">Fit</button>
        <button class="btn small" id="zoom-in" type="button" aria-label="Zoom in">+</button>
      </div>
    </section>
    <aside class="pane side" aria-label="Details">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="panel" id="panel" role="tabpanel"></div>
    </aside>
  </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script type="module">
/*__BUNDLE__*/
{
const EXAMPLE = /*__EXAMPLE__*/null;
const STORE_KEY = 'archify-enterprise-studio:model:v1';
const $ = (id) => document.getElementById(id);
const h = (tag, attrs = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (value === false || value === undefined || value === null) continue;
    if (key === 'class') node.className = value;
    else if (key === 'text') node.textContent = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else if (key === 'value') node.value = value;
    else node.setAttribute(key, value === true ? '' : value);
  }
  for (const child of children.flat(Infinity)) if (child !== null && child !== undefined && child !== false) node.append(child);
  return node;
};

// Native append() stringifies arrays and null; this accepts the same children as h().
const add = (parent, ...children) => parent.append(...children.flat(Infinity).filter((child) => child !== null && child !== undefined && child !== false));

// A stored model that no longer validates is never thrown away: it is handed
// back as text so the Model tab can show it for repair.
function loadStored() {
  let raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch (error) { return {}; }
  if (!raw) return {};
  try { const parsed = JSON.parse(raw); if (validateModel(parsed).ok) return { model: parsed }; } catch (error) { /* fall through with the raw text */ }
  return { rejected: raw };
}
const stored = loadStored();
const state = {
  model: stored.model || structuredClone(EXAMPLE),
  viewId: null, tab: stored.rejected ? 'model' : 'inspect', selected: null, // selected: { type: 'element' | 'relationship', id }
  codeTarget: 'typescript', codeFile: 0, phase: 'all', query: '', preset: null,
  zoom: 1, panX: 0, panY: 0, fitted: false, run: null, adding: false, sourceDraft: stored.rejected || null,
  sourceError: stored.rejected ? [{ severity: 'error', message: 'Your saved model has errors, so the example is shown instead. Your JSON is below: fix it and press Apply, or press Discard edits to drop it.' }] : null,
};

function viewSlug(id) { return id.replace(/_/g, '-'); }
function initialView() {
  const wanted = location.hash.replace(/^#/, '');
  return (state.model.views.find((view) => viewSlug(view.id) === wanted) || state.model.views[0])?.id || null;
}
state.viewId = initialView();

const currentView = () => state.model.views.find((view) => view.id === state.viewId) || state.model.views[0];
const elementById = (id) => state.model.elements.find((element) => element.id === id);
function effectiveTheme() {
  if (state.preset === 'blueprint') return 'blueprint';
  const explicit = document.documentElement.dataset.theme;
  if (explicit === 'dark' || explicit === 'light') return explicit;
  return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
}

let toastTimer;
function toast(message) {
  const node = $('toast'); node.textContent = message; node.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { node.hidden = true; }, 2200);
}
async function copyText(text, what) {
  try { await navigator.clipboard.writeText(text); toast(`Copied ${what}`); }
  catch (error) {
    const area = h('textarea', { class: 'sr' }); area.value = text; document.body.append(area); area.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (inner) { ok = false; }
    area.remove(); toast(ok ? `Copied ${what}` : 'Copy was blocked. Select the text and copy it manually.');
  }
}

// Removing things can empty a view. A view with nothing to draw is invalid,
// so it goes too; the last remaining view is never removed.
function viewIsDrawable(view) {
  return view.type === 'sequence'
    ? (view.participants || []).length >= 2 && (view.messages || []).length >= 1
    : (view.nodes || []).length >= 1;
}
function wouldEmptyModel(change) {
  const trial = structuredClone(state.model); change(trial);
  return !trial.views.some(viewIsDrawable);
}
function pruneViews() {
  const dropped = state.model.views.filter((view) => !viewIsDrawable(view));
  if (!dropped.length) return '';
  state.model.views = state.model.views.filter(viewIsDrawable);
  if (!state.model.views.some((view) => view.id === state.viewId)) { state.viewId = state.model.views[0].id; state.fitted = false; }
  return ` Removed ${dropped.length === 1 ? `the now-empty view "${dropped[0].title}"` : `${dropped.length} now-empty views`}.`;
}

function commit(message) {
  const pruned = pruneViews();
  if (message && pruned) message += pruned;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state.model)); } catch (error) { /* storage unavailable */ }
  state.sourceDraft = null; state.sourceError = null; state.run = null;
  renderAll();
  if (message) toast(message);
}

// ---- Rail -------------------------------------------------------------------
function renderRail() {
  const rail = $('rail'); rail.replaceChildren();
  const families = new Map();
  for (const view of state.model.views) {
    const family = VIEW_TYPES[view.type].family;
    families.set(family, [...(families.get(family) || []), view]);
  }
  for (const [family, views] of families) {
    add(rail, h('section', {}, h('div', { class: 'label', text: family }), views.map((view) => h('button', {
      class: 'view-link', type: 'button', 'aria-current': view.id === state.viewId ? 'true' : 'false', title: VIEW_TYPES[view.type].label,
      onclick: () => selectView(view.id),
    }, h('span', { text: view.title }), h('small', { text: view.type })))));
  }
  const query = state.query.trim().toLowerCase();
  const matches = state.model.elements.filter((element) => !query || element.label.toLowerCase().includes(query) || element.kind.includes(query) || element.id.toLowerCase().includes(query)).slice(0, 60);
  const search = h('input', { class: 'search', id: 'element-search', type: 'search', placeholder: 'Find element…', 'aria-label': 'Find element', value: state.query, oninput: (event) => { state.query = event.target.value; renderRail(); $('element-search').focus(); } });
  add(rail, h('section', { class: 'elements' }, h('div', { class: 'label', text: `Repository · ${state.model.elements.length}` }), search,
    matches.map((element) => h('button', { class: 'view-link', type: 'button', style: `--tone: var(--${toneOf(element)})`, onclick: () => focusElement(element.id) }, h('span', { class: 'dot' }), h('span', { text: element.label || element.kind }), h('small', { text: KINDS[element.kind].label.split(' ').pop() })))));
}

function selectView(id) {
  state.viewId = id; state.selected = null; state.fitted = false; state.run = null; state.adding = false;
  try { history.replaceState(null, '', `#${viewSlug(id)}`); } catch (error) { location.hash = viewSlug(id); }
  renderAll();
}
function focusElement(id) {
  const view = currentView();
  const here = view.type === 'sequence' ? (view.participants || []).includes(id) : (view.nodes || []).some((node) => node.ref === id);
  if (!here) { const other = viewsOfElement(state.model, id)[0]; if (other) { state.viewId = other.id; state.fitted = false; state.run = null; } }
  state.selected = { type: 'element', id }; state.tab = 'inspect';
  renderAll();
}

// ---- Canvas -----------------------------------------------------------------
let rendered = null;
function renderCanvas() {
  const view = currentView();
  const inner = $('canvas-inner');
  if (!view) { inner.replaceChildren(); return; }
  try { rendered = renderView(state.model, view.id, { theme: effectiveTheme() }); }
  catch (error) { inner.replaceChildren(h('p', { class: 'diag error', text: error.message })); return; }
  inner.innerHTML = rendered.svg;
  const svg = inner.querySelector('svg');
  if (!state.fitted) fit();
  applyTransform();
  applySelection(svg);
  drawTokens(svg);
  renderCanvasTools();
}
function fit() {
  const canvas = $('canvas');
  const scale = Math.min(1.4, (canvas.clientWidth - 24) / rendered.width, (canvas.clientHeight - 24) / rendered.height);
  state.zoom = Math.max(0.2, scale || 1);
  state.panX = Math.max(12, (canvas.clientWidth - rendered.width * state.zoom) / 2);
  state.panY = Math.max(12, (canvas.clientHeight - rendered.height * state.zoom) / 2);
  state.fitted = true;
}
function applyTransform() { $('canvas-inner').style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.zoom})`; }
function zoomBy(factor, cx, cy) {
  const canvas = $('canvas'); const rect = canvas.getBoundingClientRect();
  const x = (cx ?? rect.left + rect.width / 2) - rect.left; const y = (cy ?? rect.top + rect.height / 2) - rect.top;
  const next = Math.min(3, Math.max(0.2, state.zoom * factor));

  applyTransform();
}
function applySelection(svg) {
  if (!svg) return;
  svg.classList.toggle('has-focus', Boolean(state.selected));
  for (const node of svg.querySelectorAll('.ea-node, .ea-edge')) node.classList.remove('is-selected', 'is-linked');
  if (!state.selected) return;
  if (state.selected.type === 'element') {
    for (const node of svg.querySelectorAll('.ea-node')) if (node.dataset.id === state.selected.id) node.classList.add('is-selected');
    for (const edge of svg.querySelectorAll('.ea-edge')) {
      if (edge.dataset.from !== state.selected.id && edge.dataset.to !== state.selected.id) continue;

  add(panel, h('div', { class: 'row' }, files.map((entry, index) => h('button', { class: 'chip', type: 'button', 'aria-pressed': index === state.codeFile ? 'true' : 'false', onclick: () => { state.codeFile = index; renderPanel(); } }, entry.path.split('/').pop()))),
    h('div', { class: 'row' }, h('span', { class: 'label grow', text: file.path }),
      h('button', { class: 'btn small', type: 'button', onclick: () => copyText(file.content, file.path.split('/').pop()) }, 'Copy file'),
      h('button', { class: 'btn small', type: 'button', onclick: () => copyText(files.map((entry) => `// ---- ${entry.path} ----\n${entry.content}`).join('\n'), `${files.length} files`) }, 'Copy all')),
    h('pre', { class: 'code', tabindex: '0', text: file.content }));
}

function renderTasks(panel) {
  const plan = generateTasks(state.model);
  add(panel, h('div', { class: 'stats' },
    h('div', { class: 'stat' }, h('b', { text: String(plan.totals.tasks) }), h('span', { class: 'label', text: 'Tasks' })),
    h('div', { class: 'stat' }, h('b', { text: String(plan.totals.points) }), h('span', { class: 'label', text: 'Points' })),
    h('div', { class: 'stat' }, h('b', { text: String(plan.totals.waves) }), h('span', { class: 'label', text: 'Waves' }))),
    h('p', { text: 'Tasks come from the model and are grouped by TOGAF ADM phase. Dependencies follow the relationships you drew; a wave is a set of tasks that can run in parallel.' }),
    h('div', { class: 'row' }, h('button', { class: 'chip', type: 'button', 'aria-pressed': state.phase === 'all' ? 'true' : 'false', onclick: () => { state.phase = 'all'; renderPanel(); } }, 'All'),
      plan.phases.map((phase) => h('button', { class: 'chip', type: 'button', title: phase.label, 'aria-pressed': state.phase === phase.id ? 'true' : 'false', onclick: () => { state.phase = phase.id; renderPanel(); } }, `${phase.id} · ${phase.tasks.length}`))),
    h('div', { class: 'row' },
      h('button', { class: 'btn small', type: 'button', onclick: () => copyText(tasksMarkdown(plan), 'Markdown plan') }, 'Copy Markdown'),
      h('button', { class: 'btn small', type: 'button', onclick: () => copyText(tasksCsv(plan), 'CSV') }, 'Copy CSV'),
      h('button', { class: 'btn small', type: 'button', onclick: () => copyText(JSON.stringify(plan, null, 2), 'JSON') }, 'Copy JSON'),
      h('button', { class: 'btn small', type: 'button', title: 'Agent program for the GOAL language', onclick: () => copyText(tasksGoal(plan).map((file) => `% ---- ${file.path} ----\n${file.content}`).join('\n'), 'GOAL agent program') }, 'Copy GOAL agent')));
  for (const dropped of plan.droppedDependencies) add(panel, h('div', { class: 'diag', text: `Dependency cycle: ${dropped.task} no longer waits for ${dropped.dependsOn}.` }));
  for (const phase of plan.phases) {
    if (state.phase !== 'all' && state.phase !== phase.id) continue;
    add(panel, h('div', { class: 'phase' }, h('span', { class: 'label', text: `Phase ${phase.id}` }), h('b', { text: phase.label })));
    for (const task of plan.tasks.filter((entry) => entry.phase === phase.id)) {
      add(panel, h('button', { class: 'task', type: 'button', title: task.acceptance.join('\n'), onclick: () => { if (task.trace.element) focusElement(task.trace.element); else if (task.trace.view) selectView(task.trace.view); } },
        h('span', { class: 'head' }, h('span', { class: 'id', text: task.id }), h('span', { class: 'title', text: task.title })),
        h('span', { class: 'meta', text: `${task.type} · ${task.estimate} pt · wave ${task.wave}${task.dependsOn.length ? ` · after ${task.dependsOn.join(', ')}` : ''}` })));
    }
  }
}

function renderModel(panel) {
  const text = state.sourceDraft ?? JSON.stringify(state.model, null, 2);
  const area = h('textarea', { class: 'source', id: 'model-source', spellcheck: 'false', 'aria-label': 'Model JSON', oninput: (event) => { state.sourceDraft = event.target.value; } });
  area.value = text;
  const apply = () => {
    let parsed;
    try { parsed = JSON.parse($('model-source').value); } catch (error) { state.sourceError = [{ severity: 'error', message: `Not valid JSON: ${error.message}` }]; renderPanel(); return; }
    const result = validateModel(parsed);
    if (!result.ok) { state.sourceError = result.diagnostics.filter((entry) => entry.severity === 'error'); renderPanel(); return; }
    state.model = parsed; state.selected = null;
    if (!parsed.views.some((view) => view.id === state.viewId)) state.viewId = parsed.views[0]?.id || null;
    state.fitted = false;
    commit('Model applied');
  };
  const fileInput = h('input', { id: 'model-file', type: 'file', accept: '.json,application/json', class: 'sr', 'aria-label': 'Open model file', onchange: async (event) => { const file = event.target.files[0]; if (!file) return; state.sourceDraft = await file.text(); renderPanel(); toast('File loaded. Press Apply to use it.'); } });
  add(panel, h('p', { text: 'The model is typed JSON: elements, relationships, and views that place elements on a row/col grid. Edit it here, or hand the same file to the enterprise CLI.' }),
    h('div', { class: 'row' }, h('button', { class: 'btn small', type: 'button', onclick: apply }, 'Apply'),
      h('button', { class: 'btn small', type: 'button', onclick: () => copyText($('model-source').value, 'model JSON') }, 'Copy'),
      h('button', { class: 'btn small', type: 'button', onclick: () => fileInput.click() }, 'Open file…'), fileInput,
      state.sourceDraft !== null ? h('button', { class: 'btn small', type: 'button', onclick: () => commit('Edits discarded.') }, 'Discard edits') : null),
    (state.sourceError || []).slice(0, 6).map((entry) => h('div', { class: 'diag error', text: entry.message })), area);
}

function renderPanel() {
  const panel = $('panel'); const scroll = panel.scrollTop; panel.replaceChildren();
  ({ inspect: renderInspect, code: renderCode, tasks: renderTasks, model: renderModel })[state.tab](panel);
  panel.scrollTop = state.tab === 'inspect' ? 0 : scroll;
}

function renderAll() {
  $('model-title').textContent = state.model.meta?.title || '';
  $('theme-name').textContent = state.preset || document.documentElement.dataset.theme || 'auto';
  renderRail(); renderCanvas(); renderAddPopover(); renderTabs(); renderPanel();
}

// ---- Chrome -----------------------------------------------------------------
const THEME_CYCLE = ['auto', 'dark', 'light', 'blueprint'];
let themeChoice = 'auto'; const hostTheme = document.documentElement.dataset.theme;
$('theme-btn').addEventListener('click', () => {
  themeChoice = THEME_CYCLE[(THEME_CYCLE.indexOf(themeChoice) + 1) % THEME_CYCLE.length];
  const root = document.documentElement;
  state.preset = themeChoice === 'blueprint' ? 'blueprint' : null;
  if (state.preset) root.dataset.preset = 'blueprint'; else delete root.dataset.preset;
  if (themeChoice === 'dark' || themeChoice === 'light') root.dataset.theme = themeChoice;
  else if (themeChoice === 'blueprint') root.dataset.theme = 'dark';
  else if (hostTheme) root.dataset.theme = hostTheme; else delete root.dataset.theme;
  renderCanvas(); $('theme-name').textContent = themeChoice;
});
new MutationObserver(() => { if (themeChoice === 'auto') renderCanvas(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => renderCanvas());
$('export-svg').addEventListener('click', () => copyText(renderView(state.model, currentView().id, { theme: effectiveTheme() }).svg, 'SVG'));
$('reset-btn').addEventListener('click', () => { state.model = structuredClone(EXAMPLE); state.viewId = state.model.views[0].id; state.selected = null; state.fitted = false; commit('Example model loaded'); });
window.addEventListener('hashchange', () => { const next = initialView(); if (next && next !== state.viewId) selectView(next); });
window.addEventListener('resize', () => { if (rendered) { fit(); applyTransform(); } });

renderAll();
}
</script>
